<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Study Whiteboard</title>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Route Guard: If not logged in, bounce back to auth.html
    async function protectRoute() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'auth.html';
        }
    }
    protectRoute();

    // Logout Function
    async function logoutUser() {
        await supabaseClient.auth.signOut();
        window.location.href = 'auth.html';
    }
</script>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

  /* ---------- docks (one row, never overlap) ---------- */
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;z-index:10;pointer-events:none}
  #bar>.dock{pointer-events:auto;flex:0 1 auto;min-width:0}
  #bar>#dockMain{margin:0 auto}
  .dock{display:flex;align-items:flex-end;gap:clamp(1px,.4vw,6px);padding:8px clamp(6px,1vw,14px) 6px;
    background:linear-gradient(#f4f6f8,#dfe3e8);border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.6)}
  #dockPage{border-radius:16px 0 0 0}
  #dockMenu{border-radius:0 16px 0 0}
  #dockMenu.collapsed .btn:not(#chev){display:none}
  #dockMenu.collapsed #chev svg{transform:rotate(180deg)}

  .btn{width:clamp(30px,3.3vw,44px);height:clamp(30px,3.3vw,44px);flex:0 0 auto;border:0;background:transparent;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
  .btn:active{background:rgba(0,0,0,.12)}
  .btn svg{width:80%;height:80%;pointer-events:none}
  .btn.disabled{opacity:.35;pointer-events:none}
  /* selected tool pops up like a raised tab */
  #dockMain .btn.active{height:calc(clamp(30px,3.3vw,44px) + 10px);margin-top:-10px;background:linear-gradient(#fff,#eef1f4);
    border-radius:12px 12px 4px 4px;box-shadow:0 -3px 8px rgba(0,0,0,.35)}
  #chev{width:26px}
  #chev svg{width:16px;height:30px;transition:transform .25s}

  .pbtn{width:clamp(28px,3vw,40px)}
  .pbtn svg{width:70%;height:70%}
  #pageNum{position:relative;flex:0 0 auto;width:clamp(34px,3.4vw,46px);height:clamp(30px,3.3vw,44px);border:0;background:transparent;cursor:pointer;padding:0}
  #pageNum .cal{position:absolute;inset:6px 2px 2px 2px;background:#fff;border:1px solid #888;border-radius:4px;
    font:700 17px/34px Arial;text-align:center;color:#111;box-shadow:0 2px 3px rgba(0,0,0,.3)}
  #pageNum .cal:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#444;border-radius:4px 4px 0 0}
  #badge{position:absolute;top:0;right:-2px;min-width:17px;height:17px;border-radius:9px;background:#e11d1d;color:#fff;
    font:700 11px/17px Arial;text-align:center;padding:0 3px;z-index:2}

  /* ---------- popups ---------- */
  .pop{position:fixed;bottom:80px;max-width:96vw;background:#fff;border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.6);
    z-index:20;display:none;color:#222;font-size:14px}
  .pop.show{display:block}
  .menuItem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .menuItem:hover{background:#eef2ff}
  #popMenu,#popFiles,#popZoom{left:12px}
  .pop h4{margin:0 0 8px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.05em}
  #popTools .row{display:flex;gap:8px;margin-bottom:10px}
  .bg{width:48px;height:34px;border-radius:6px;border:2px solid #ccc;cursor:pointer}
  .bg.sel{border-color:#2563eb}

  /* big popups: pen / shapes / eraser */
  .pop.big{padding:0;width:min(660px,96vw);left:50%;transform:translateX(-50%);bottom:84px;overflow:auto;max-height:calc(100vh - 100px);border-radius:10px}
  .pop.big.sm{width:min(420px,96vw)}
  .popTitle{background:#111;color:#fff;font-size:17px;font-weight:600;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
  .popTitle .x{cursor:pointer;font-size:20px;line-height:1;padding:0 2px}
  .penBody{display:flex;gap:12px;padding:14px 12px 14px 18px;background:#fff}
  .penMain{flex:1;min-width:0}
  .sliderRow{display:flex;align-items:center;gap:18px}
  .rng{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:16px;border-radius:8px;background:linear-gradient(#c9cfd6,#f4f6f8);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.35);outline:none;margin:0}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9ced5 60%,#8e959d);
    border:2px solid #7d858e;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
  .rng::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9ced5 60%,#8e959d);
    border:2px solid #7d858e;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
  .prev{width:64px;height:64px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px #d5dae0}

  .tray{margin-top:14px;height:136px;border-radius:26px;background:linear-gradient(#e6ebf0,#fbfcfd);
    box-shadow:inset 0 5px 12px rgba(0,0,0,.28),inset 0 -2px 4px rgba(255,255,255,.9),0 0 0 3px #f2f5f8;
    display:flex;justify-content:space-around;align-items:flex-end;padding:0 10px;overflow:hidden}
  .brush{width:clamp(26px,7.5vw,54px);height:120px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;transition:transform .15s}
  .brush svg{height:118px;width:auto;pointer-events:none}
  .brush.sel{transform:translateY(-12px);filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}

  .shapeTray{margin-top:12px;border-radius:22px;background:linear-gradient(#e6ebf0,#fbfcfd);
    box-shadow:inset 0 5px 12px rgba(0,0,0,.25),0 0 0 3px #f2f5f8;padding:12px 10px;
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:226px;overflow-y:auto}
  .shp{height:52px;border-radius:12px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:linear-gradient(#fbfcfe,#e7ecf2);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .shp.sel{border-color:#2f9bff;background:#e9f5ff}
  .sh{width:38px;height:38px;fill:#55c2f2;stroke:#12304a;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
  .sh.ln{fill:none;stroke:#111;stroke-width:3.5}
  .fillRow{display:block;margin-top:10px;font-size:13px;color:#555}

  .palette{width:132px;flex:0 0 auto;background:#0b0b0b;border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
    align-content:start;overflow-y:auto;max-height:262px}
  .sw2{aspect-ratio:1;border-radius:7px;cursor:pointer;border:2px solid transparent}
  .sw2.sel{border-color:#fff;box-shadow:0 0 0 2px #2563eb}
  .eye{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#222}
  .eye svg{width:70%;height:70%}

  /* selection bar + poly finish */
  #selBar{position:fixed;display:none;gap:4px;background:#fff;border-radius:12px;padding:5px;box-shadow:0 4px 16px rgba(0,0,0,.6);z-index:15}
  #selBar button{border:0;background:#f1f4f8;border-radius:8px;padding:9px 13px;font:600 14px Segoe UI,Arial,sans-serif;cursor:pointer;color:#222}
  #selBar button:hover{background:#dbeafe}
  #selBar .del{color:#b91c1c}
  #polyDone{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;display:none;z-index:14;border:0;border-radius:22px;padding:10px 20px;
    background:#2f9bff;color:#fff;font:700 15px Segoe UI,Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.6);cursor:pointer}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111;padding:8px 16px;border-radius:20px;
    font-size:14px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;max-width:92vw;text-align:center}
  #toast.show{opacity:1}
  @media (max-width:600px){.palette{width:104px}.sw2{border-radius:5px}}

  /* ---------- Tools panel ---------- */
  .toolGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:6px 14px 6px}
  .secTitle{grid-column:1/-1;font-size:12px;font-weight:700;color:#667;text-transform:uppercase;letter-spacing:.07em;margin:8px 0 0}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:10px 4px 8px;border-radius:12px;
    background:linear-gradient(#fbfcfe,#e7ecf2);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;font-size:12px;font-weight:600;color:#333;text-align:center;line-height:1.15;border:3px solid transparent}
  .tile:hover{background:#eef6ff}
  .tile.on{border-color:#2f9bff;background:#e9f5ff}
  .tile svg{width:42px;height:42px;pointer-events:none}
  .boardRow{display:flex;gap:10px;align-items:center;padding:8px 14px 14px;flex-wrap:wrap}
  .boardRow label{margin-left:10px;font-size:14px}
  /* floating widgets: timer, stopwatch, calculator */
  .wdg{position:fixed;z-index:12;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.65);color:#222;overflow:hidden;min-width:262px;max-width:96vw}
  .wdg .wh{background:#111;color:#fff;padding:7px 10px 7px 14px;display:flex;justify-content:space-between;align-items:center;cursor:move;font-weight:600;font-size:14px;touch-action:none}
  .wdg .wh .x{cursor:pointer;padding:0 4px;font-size:18px}
  .wdg .wb{padding:12px}
  .lcd{background:#0f1720;color:#7cffb2;font:700 34px/1.15 'Courier New',monospace;text-align:right;border-radius:8px;padding:8px 12px;margin-bottom:10px;overflow:hidden;white-space:nowrap}
  .lcd small{display:block;font-size:13px;color:#6fa;min-height:16px;opacity:.75}
  .wbtn{border:0;border-radius:8px;padding:10px 6px;font:700 15px 'Segoe UI',Arial,sans-serif;background:#eef1f5;cursor:pointer;color:#222;flex:1}
  .wbtn:active{background:#cfe3ff}
  .wbtn.op{background:#dbeafe}.wbtn.go{background:#2f9bff;color:#fff}.wbtn.stop{background:#e53935;color:#fff}
  .row2{display:flex;gap:6px;margin-top:6px}
  .row2 .wbtn{white-space:nowrap;padding:10px 4px;font-size:14px}
  .calc{display:grid;grid-template-columns:repeat(4,58px);gap:6px}
  .calc .wbtn{padding:12px 0;font-size:18px}
  .span2{grid-column:span 2}
  .laps{font:600 13px 'Courier New',monospace;margin-top:8px;color:#444;max-height:84px;overflow:auto}
  /* spotlight + screen shade */
  #spot{position:fixed;inset:0;z-index:8;display:none;overflow:hidden;touch-action:none;cursor:move}
  #spotHole{position:absolute;box-shadow:0 0 0 4000px rgba(0,0,0,.9);pointer-events:none}
  #spotCtl{position:fixed;z-index:9;display:none;gap:6px;top:12px;right:12px;background:#fff;border-radius:22px;padding:5px 8px;box-shadow:0 4px 16px rgba(0,0,0,.6)}
  #spotCtl button{border:0;background:#eef1f5;border-radius:16px;padding:7px 12px;font:700 14px 'Segoe UI',Arial,sans-serif;cursor:pointer;color:#222}
  #shade{position:fixed;z-index:8;display:none;background:linear-gradient(#2d3138,#1a1d22);touch-action:none}
  #shade .hd{position:absolute;background:#f4f6f8;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none}
  #shade .hd.top{bottom:10px;left:50%;transform:translateX(-50%);width:140px;height:36px}
  #shade .hd.bottom{top:10px;left:50%;transform:translateX(-50%);width:140px;height:36px}
  #shade .hd.left{right:10px;top:50%;transform:translateY(-50%);width:36px;height:140px;flex-direction:column;padding:10px 0}
  #shade .hd.right{left:10px;top:50%;transform:translateY(-50%);width:36px;height:140px;flex-direction:column;padding:10px 0}
  #shade .gb{cursor:pointer;font-size:17px;padding:2px 4px;user-select:none}
  #shade .grip{font-size:20px;color:#889;pointer-events:none}
  /* laser pointer + magnifier */
  #laserCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;display:none}
  #mag{position:fixed;display:none;z-index:9;pointer-events:none}
  #mag canvas{display:block;border-radius:50%;background:#000;box-shadow:0 8px 28px rgba(0,0,0,.75),0 0 0 4px #f4f6f8,0 0 0 6px #8b96a1}
  #magCtl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:14px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:5px 8px;
    box-shadow:0 4px 16px rgba(0,0,0,.6);pointer-events:auto;white-space:nowrap;touch-action:none}
  #magCtl button{border:0;background:#eef1f5;border-radius:16px;padding:7px 12px;font:700 14px 'Segoe UI',Arial,sans-serif;cursor:pointer;color:#222}
  #magGrip{cursor:move;font:700 14px 'Segoe UI',Arial,sans-serif;color:#223;padding:0 6px;user-select:none}
  #magF{font:700 13px 'Segoe UI',Arial,sans-serif;color:#445;min-width:34px;text-align:center}
  /* dice */
  .diceRow{display:flex;gap:14px;justify-content:center;margin:4px 0 12px}
  .die{width:76px;height:76px;border-radius:15px;background:linear-gradient(#fff,#e9edf2);border:3px solid #222;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
  .die i{border-radius:50%;margin:auto;width:13px;height:13px}
  .die i.p{background:#1b1b1b}
  .die.roll{animation:wob .12s infinite alternate}
  @keyframes wob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  .diceSum{text-align:center;font:700 18px 'Segoe UI',Arial,sans-serif;margin-top:10px;color:#223;min-height:24px}
  /* narrow screens: two-row bar so the three docks never crowd each other */
  @media (max-width:620px){
    #bar{flex-wrap:wrap;justify-content:space-between;gap:6px 8px;align-items:flex-end}
    #bar>#dockMain{order:2;flex:1 0 100%;margin:0;justify-content:center;border-radius:16px 16px 0 0;padding-top:12px}
    #bar>#dockMenu,#bar>#dockPage{order:1;border-radius:14px 14px 0 0;padding-top:6px}
    #bar>#dockMenu{border-radius:0 14px 0 0}#bar>#dockPage{border-radius:14px 0 0 0}
    .pop,.pop.big{bottom:130px}
    .pop.big{max-height:calc(100vh - 150px)}
    #polyDone{bottom:140px}
  }
  #selBar button.sc{font-size:17px;padding:6px 12px}
  @media (max-width:600px){.toolGrid{grid-template-columns:repeat(3,1fr)}.tile svg{width:36px;height:36px}.wdg{min-width:240px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="spot"><div id="spotHole"></div></div>
<div id="spotCtl"><button id="spotMinus" title="Smaller">－</button><button id="spotPlus" title="Bigger">＋</button><button id="spotShape" title="Circle / rectangle">◯ ▭</button><button id="spotX">✕ Close</button></div>
<div id="shade"><div class="hd top" id="shadeHd"><span class="gb" id="shadeSide" title="Move to another side">⟳</span><span class="grip">≡</span><span class="gb" id="shadeX" title="Close">✕</span></div></div>
<canvas id="laserCv"></canvas>
<div id="mag"><canvas id="magCv"></canvas><div id="magCtl"><span id="magGrip" title="Drag to move">✥ Move</span><button id="magMinus" title="Zoom out">－</button><span id="magF">×2.5</span><button id="magPlus" title="Zoom in">＋</button><button id="magX" title="Close">✕</button></div></div>
<input type="file" id="imgIn" accept="image/*" hidden>

<button id="polyDone">✓ Finish shape</button>
<div id="selBar"><button id="selMinus" class="sc" style="display:none" title="Smaller">－</button><button id="selPlus" class="sc" style="display:none" title="Bigger">＋</button><button id="selDup">⧉ Duplicate</button><button id="selDel" class="del">🗑 Delete</button><button id="selX" title="Deselect">✕</button></div>
<input type="color" id="colorIn" style="position:fixed;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px">

<div id="bar">
<!-- ============ BOTTOM LEFT : menu dock ============ -->
<div class="dock" id="dockMenu">
  <button class="btn" id="chev" title="Hide / show menu">
    <svg viewBox="0 0 16 30"><path d="M12 3 L3 15 L12 27" fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn" data-pop="popMenu" title="Menu">
    <svg viewBox="0 0 40 40"><g fill="#3a3f45"><rect x="5" y="6" width="30" height="7" rx="3.5"/><rect x="5" y="17" width="30" height="7" rx="3.5"/><rect x="5" y="28" width="30" height="7" rx="3.5"/></g><g fill="#fff"><circle cx="10" cy="9.5" r="1.8"/><circle cx="10" cy="20.5" r="1.8"/><circle cx="10" cy="31.5" r="1.8"/></g></svg>
  </button>
  <button class="btn" id="btnFull" title="Full screen">
    <svg viewBox="0 0 40 40"><rect x="3" y="5" width="34" height="23" rx="2" fill="#1c8cf0" stroke="#0b5db0" stroke-width="2"/><rect x="5" y="7" width="30" height="8" fill="#6cc0ff" opacity=".6"/><rect x="16" y="28" width="8" height="4" fill="#888"/><rect x="10" y="32" width="20" height="3" rx="1.5" fill="#666"/></svg>
  </button>
  <button class="btn" data-pop="popTools" title="Tools / settings">
    <svg viewBox="0 0 40 40"><path d="M6 33 L22 17" stroke="#444" stroke-width="5" stroke-linecap="round"/><circle cx="26" cy="13" r="8" fill="none" stroke="#555" stroke-width="4"/><path d="M33 33 L17 17" stroke="#b5651d" stroke-width="5" stroke-linecap="round"/><rect x="9" y="5" width="12" height="7" rx="1" transform="rotate(-45 15 8)" fill="#555"/></svg>
  </button>
  <button class="btn" data-pop="popFiles" title="Files / save">
    <svg viewBox="0 0 40 40"><path d="M3 14 h12 l3 4 h19 v16 a2 2 0 0 1 -2 2 h-30 a2 2 0 0 1 -2 -2z" fill="#e8ecf1" stroke="#7b8794" stroke-width="2"/><path d="M12 14 L26 6 L22 10 H34 L30 14" fill="none" stroke="#1c8cf0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn" data-pop="popZoom" title="Zoom / find">
    <svg viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="3" fill="#7fb8ee"/><circle cx="18" cy="18" r="9" fill="#fff" fill-opacity=".55" stroke="#333" stroke-width="3"/><path d="M25 25 L35 35" stroke="#333" stroke-width="5" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- ============ BOTTOM CENTER : tool dock ============ -->
<div class="dock" id="dockMain">
  <button class="btn" data-tool="select" title="Select (drag a circle around things)">
    <svg viewBox="0 0 40 40"><path d="M10 4 L10 31 L17 25 L22 36 L27 34 L22 23 L31 23 Z" fill="#333" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn active" data-tool="pen" title="Pen / brushes">
    <svg viewBox="0 0 40 40"><path d="M20 2 C24 8 26 12 26 16 L14 16 C14 12 16 8 20 2Z" fill="#2ecc4a"/><path d="M14 16 H26 L24 38 H16Z" fill="#3b2a20"/><circle cx="20" cy="26" r="3" fill="#d9a066"/></svg>
  </button>
  <button class="btn" data-tool="eraser" title="Eraser">
    <svg viewBox="0 0 40 40"><g transform="rotate(-35 20 20)"><rect x="4" y="12" width="32" height="16" rx="3" fill="#7fc8ff" stroke="#3b8ed0" stroke-width="2"/><rect x="4" y="12" width="12" height="16" rx="3" fill="#fff" stroke="#9bb" stroke-width="2"/><rect x="18" y="17" width="14" height="6" fill="#fff" opacity=".8"/></g></svg>
  </button>
  <button class="btn" data-tool="shape" title="Shapes &amp; lines">
    <svg viewBox="0 0 40 40" class="sh"><rect x="6" y="6" width="28" height="28" rx="1"/></svg>
  </button>
  <button class="btn" data-tool="pan" title="Move canvas">
    <svg viewBox="0 0 40 40"><path d="M12 22 V10 a2 2 0 0 1 4 0 V18 V7 a2 2 0 0 1 4 0 V18 V8 a2 2 0 0 1 4 0 V19 V12 a2 2 0 0 1 4 0 V26 c0 7 -4 10 -9 10 c-5 0 -7 -3 -10 -8 l-3 -5 a2 2 0 0 1 3 -2 z" fill="#fff" stroke="#555" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const ink=document.createElement('canvas'),ictx=ink.getContext('2d');    // cached layer holding all committed drawings

/* ================= state ================= */
var mag=null;
let st={tool:'pen',brush:'chinese',color:'#2ecc4a',size:4,lw:4,shape:'rect',fill:false,bg:'dark',grid:true,zoom:1};
let ERS=18;                     // eraser radius (world units)
const newPage=()=>({objs:[],hist:[[]],hi:0,px:0,py:0});
let pages=[newPage()],cur=0;
let drawing=null,panStart=null,eraserPos=null,lastE=null;
let selObjs=[],selMove=null,lasso=null,hideSet=null;
let polyDraft=null,polyCursor=null,lastTap={t:0,x:0,y:0};
let inkDirty=true,inkState={px:0,py:0,zoom:1,cur:0},fillTouched=false;
const P=()=>pages[cur];

/* ================= helpers ================= */
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function resize(){const d=devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);ink.width=cv.width;ink.height=cv.height;inkDirty=true;draw()}
addEventListener('resize',resize);
function world(e){return{x:(e.clientX-P().px)/st.zoom,y:(e.clientY-P().py)/st.zoom}}
const clone=o=>JSON.parse(JSON.stringify(o));
function snapshot(){const p=P();p.hist=p.hist.slice(0,p.hi+1);p.hist.push(clone(p.objs));p.hi=p.hist.length-1;updUI()}
function undo(){const p=P();if(p.hi>0){p.hi--;p.objs=clone(p.hist[p.hi]);selObjs=[];inkDirty=true;draw();updUI()}}
function redo(){const p=P();if(p.hi<p.hist.length-1){p.hi++;p.objs=clone(p.hist[p.hi]);selObjs=[];inkDirty=true;draw();updUI()}}
function updUI(){
  const atEnd=P().hi>=P().hist.length-1;
  $('btnUndo').classList.toggle('disabled',P().hi<=0);
  $('btnRedo').classList.toggle('disabled',atEnd);
  $('btnRedo').querySelector('path').setAttribute('fill',atEnd?'#9a9a9a':'#444');
  $('pageLabel').textContent=cur+1;
  $('badge').textContent=Math.max(0,pages.length-1-cur);
  $('btnPrev').classList.toggle('disabled',cur===0);
}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const hh=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v)};

/* ================= background grid ================= */
const BG={dark:['#0b0b0b','rgba(255,255,255,.10)'],green:['#0f3d2b','rgba(255,255,255,.12)'],white:['#ffffff','rgba(0,0,0,.14)'],plain:['#1b1b1b','rgba(255,255,255,.08)']};
function drawGrid(){
  const [bg,gc]=BG[st.bg];ctx.fillStyle=bg;ctx.fillRect(0,0,innerWidth,innerHeight);
  if(!st.grid)return;
  const s=48*st.zoom,ox=((P().px%s)+s)%s,oy=((P().py%s)+s)%s;
  ctx.strokeStyle=gc;ctx.lineWidth=1;ctx.beginPath();
  for(let x=ox;x<innerWidth;x+=s){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,innerHeight)}
  for(let y=oy;y<innerHeight;y+=s){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(innerWidth,Math.round(y)+.5)}
  ctx.stroke();
  if(st.bg==='dark'){const g=ctx.createRadialGradient(innerWidth/2,innerHeight/3,100,innerWidth/2,innerHeight/2,innerWidth*.7);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight)}
}

/* ================= brushes ================= */
function eff(o){const s=o.size;switch(o.brush){case 'highlighter':return s*3.5;case 'chinese':return s*2;case 'magic':return s*2+10;case 'spray':return s*2.4+4;case 'calligraphy':return s*1.3;default:return s}}
function starAt(c,x,y,ro,ri,rot){c.beginPath();for(let i=0;i<10;i++){const r=i%2?ri:ro,a=rot+i*Math.PI/5-Math.PI/2;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill()}
function smoothPath(p){
  const n=p.length;if(n<3)return p.map((q,i)=>({x:q.x,y:q.y,d:i?Math.hypot(q.x-p[i-1].x,q.y-p[i-1].y):0}));
  const out=[{x:p[0].x,y:p[0].y,d:0}];
  for(let i=1;i<n-1;i++){
    const m={x:(p[i].x+p[i+1].x)/2,y:(p[i].y+p[i+1].y)/2};
    const a=i===1?p[0]:{x:(p[i-1].x+p[i].x)/2,y:(p[i-1].y+p[i].y)/2};
    const d=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    for(let k=1;k<=4;k++){const t=k/4,u=1-t;out.push({x:u*u*a.x+2*u*t*p[i].x+t*t*m.x,y:u*u*a.y+2*u*t*p[i].y+t*t*m.y,d})}
  }
  const l=p[n-1];out.push({x:l.x,y:l.y,d:Math.hypot(l.x-p[n-2].x,l.y-p[n-2].y)});
  return out;
}
function strokeBrush(c,o){
  const p=o.pts,n=p.length,s=o.size,b=o.brush||'pen',oa=c.globalAlpha;
  c.strokeStyle=o.color;c.fillStyle=o.color;c.lineCap='round';c.lineJoin='round';
  const path=()=>{c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<n-1;i++){const m={x:(p[i].x+p[i+1].x)/2,y:(p[i].y+p[i+1].y)/2};c.quadraticCurveTo(p[i].x,p[i].y,m.x,m.y)}c.lineTo(p[n-1].x,p[n-1].y)};
  if(b==='spray'){const R=s*1.2+2;for(let i=0;i<n;i++)for(let k=0;k<5;k++){const a=hh(i*5+k)*6.283,r=Math.sqrt(hh(i*7.3+k*3.1+1))*R;c.beginPath();c.arc(p[i].x+Math.cos(a)*r,p[i].y+Math.sin(a)*r,.9,0,7);c.fill()}return}
  if(b==='magic'){
    if(n>1){c.save();c.globalAlpha=oa*.35;c.lineWidth=Math.max(1,s*.5);c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<n;i++)c.lineTo(p[i].x,p[i].y);c.stroke();c.restore()}
    const R=s*1.2+4,gap=s*3+14;let acc=gap,k=0;
    for(let i=0;i<n;i++){if(i>0)acc+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);if(acc>=gap){acc=0;k++;starAt(c,p[i].x,p[i].y,R,R*.45,hh(k)*1.2)}}
    return}
  if(n===1){c.beginPath();c.arc(p[0].x,p[0].y,b==='chinese'?s*.9:b==='highlighter'?s*1.75:s/2,0,7);if(b==='highlighter')c.globalAlpha=oa*.4;c.fill();c.globalAlpha=oa;return}
  if(b==='highlighter'){c.globalAlpha=oa*.4;c.lineWidth=s*3.5;c.lineCap='square';path();c.stroke();c.globalAlpha=oa;return}
  if(b==='pencil'){c.globalAlpha=oa*.8;c.lineWidth=s*.8;path();c.stroke();
    c.save();c.translate(.7,.5);c.globalAlpha=oa*.35;c.lineWidth=s*.7;path();c.stroke();c.restore();c.globalAlpha=oa;return}
  if(b==='calligraphy'){const sp=smoothPath(p);for(let i=1;i<sp.length;i++){const a=Math.atan2(sp[i].y-sp[i-1].y,sp[i].x-sp[i-1].x);
    c.lineWidth=Math.max(.8,s*(.3+1.0*Math.abs(Math.sin(a-.8))));c.beginPath();c.moveTo(sp[i-1].x,sp[i-1].y);c.lineTo(sp[i].x,sp[i].y);c.stroke()}return}
  if(b==='chinese'){
    const sp=smoothPath(p),m=sp.length;let w=s;
    for(let i=1;i<m;i++){
      const t=Math.max(.6,Math.min(1.7,1.7-sp[i].d*.09));w=w*.9+s*t*.1;
      const tf=.3+.7*Math.min(1,i/20,(m-1-i)/28);
      c.lineWidth=Math.max(.8,w*tf);c.beginPath();c.moveTo(sp[i-1].x,sp[i-1].y);c.lineTo(sp[i].x,sp[i].y);c.stroke();
    }
    return}
  c.lineWidth=s;path();c.stroke();
}

/* ================= shapes ================= */
const PN={
  triangle:[[.5,0],[1,1],[0,1]],rtriangle:[[0,0],[0,1],[1,1]],trapezoid:[[.25,0],[.75,0],[1,1],[0,1]],
  parallelogram:[[.25,0],[1,0],[.75,1],[0,1]],diamond:[[.5,0],[1,.5],[.5,1],[0,.5]],
  pentagon:[[.5,0],[1,.38],[.82,1],[.18,1],[0,.38]],hexagon:[[.25,0],[.75,0],[1,.5],[.75,1],[.25,1],[0,.5]],
  plus:[[.35,0],[.65,0],[.65,.35],[1,.35],[1,.65],[.65,.65],[.65,1],[.35,1],[.35,.65],[0,.65],[0,.35],[.35,.35]]
};
PN.rtri=PN.rtriangle;
PN.star=(()=>{const a=[];for(let i=0;i<10;i++){const r=i%2?.2:.5,g=-Math.PI/2+i*Math.PI/5;a.push([.5+Math.cos(g)*r,.5+Math.sin(g)*r])}return a})();
const NOFILL=['line','dotted','dashed','arrow','darrow','axes','numline','brace'];
function rrect(c,x,y,w,h,r){c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
function head(c,x,y,a,L){c.moveTo(x,y);c.lineTo(x-L*Math.cos(a-.45),y-L*Math.sin(a-.45));c.moveTo(x,y);c.lineTo(x-L*Math.cos(a+.45),y-L*Math.sin(a+.45))}
function shapeDraw(c,o){
  const {x1,y1,x2,y2,s}=o,w=x2-x1,h=y2-y1,aw=Math.abs(w),ah=Math.abs(h),X=u=>x1+w*u,Y=v=>y1+h*v;
  c.beginPath();
  if(PN[s]){PN[s].forEach((q,i)=>c[i?'lineTo':'moveTo'](X(q[0]),Y(q[1])));c.closePath()}
  else switch(s){
    case 'rect':c.rect(x1,y1,w,h);break;
    case 'rrect':rrect(c,Math.min(x1,x2),Math.min(y1,y2),aw,ah,Math.min(aw,ah)*.2);break;
    case 'circle':case 'ellipse':c.ellipse(x1+w/2,y1+h/2,aw/2,ah/2,0,0,7);break;
    case 'semicircle':c.ellipse(x1+w/2,y1+h/2,aw/2,ah/2,0,Math.PI,0);c.closePath();break;
  }
}
</script>
