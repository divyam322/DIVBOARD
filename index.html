<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Study Whiteboard</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

  /* ---------- docks (one row, never overlap) ---------- */
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;z-index:10;pointer-events:none}
  #bar>.dock{pointer-events:auto;flex:0 1 auto;min-width:0}
  #bar>#dockMain{margin:0 auto}
  .dock{display:flex;align-items:flex-end;gap:clamp(1px,.4vw,6px);padding:8px clamp(6px,1vw,14px) 6px;
    background:linear-gradient(#f4f6f8,#dfe3e8);border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.6)}
  #dockPage{border-radius:16px 0 0 0}
  #dockMenu{border-radius:0 16px 0 0}
  #dockMenu.collapsed .btn:not(#chev){display:none}
  #dockMenu.collapsed #chev svg{transform:rotate(180deg)}

  .btn{width:clamp(30px,3.3vw,44px);height:clamp(30px,3.3vw,44px);flex:0 0 auto;border:0;background:transparent;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
  .btn:active{background:rgba(0,0,0,.12)}
  .btn svg{width:80%;height:80%;pointer-events:none}
  .btn.disabled{opacity:.35;pointer-events:none}
  /* selected tool pops up like a raised tab */
  #dockMain .btn.active{height:calc(clamp(30px,3.3vw,44px) + 10px);margin-top:-10px;background:linear-gradient(#fff,#eef1f4);
    border-radius:12px 12px 4px 4px;box-shadow:0 -3px 8px rgba(0,0,0,.35)}
  #chev{width:26px}
  #chev svg{width:16px;height:30px;transition:transform .25s}

  .pbtn{width:clamp(28px,3vw,40px)}
  .pbtn svg{width:70%;height:70%}
  #pageNum{position:relative;flex:0 0 auto;width:clamp(34px,3.4vw,46px);height:clamp(30px,3.3vw,44px);border:0;background:transparent;cursor:pointer;padding:0}
  #pageNum .cal{position:absolute;inset:6px 2px 2px 2px;background:#fff;border:1px solid #888;border-radius:4px;
    font:700 17px/34px Arial;text-align:center;color:#111;box-shadow:0 2px 3px rgba(0,0,0,.3)}
  #pageNum .cal:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#444;border-radius:4px 4px 0 0}
  #badge{position:absolute;top:0;right:-2px;min-width:17px;height:17px;border-radius:9px;background:#e11d1d;color:#fff;
    font:700 11px/17px Arial;text-align:center;padding:0 3px;z-index:2}

  /* ---------- popups ---------- */
  .pop{position:fixed;bottom:80px;max-width:96vw;background:#fff;border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.6);
    z-index:20;display:none;color:#222;font-size:14px}
  .pop.show{display:block}
  .menuItem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .menuItem:hover{background:#eef2ff}
  #popMenu,#popFiles,#popZoom{left:12px}
  .pop h4{margin:0 0 8px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.05em}
  #popTools .row{display:flex;gap:8px;margin-bottom:10px}
  .bg{width:48px;height:34px;border-radius:6px;border:2px solid #ccc;cursor:pointer}
  .bg.sel{border-color:#2563eb}

  /* big popups: pen / shapes / eraser */
  .pop.big{padding:0;width:min(660px,96vw);left:50%;transform:translateX(-50%);bottom:84px;overflow:auto;max-height:calc(100vh - 100px);border-radius:10px}
  .pop.big.sm{width:min(420px,96vw)}
  .popTitle{background:#111;color:#fff;font-size:17px;font-weight:600;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
  .popTitle .x{cursor:pointer;font-size:20px;line-height:1;padding:0 2px}
  .penBody{display:flex;gap:12px;padding:14px 12px 14px 18px;background:#fff}
  .penMain{flex:1;min-width:0}
  .sliderRow{display:flex;align-items:center;gap:18px}
  .rng{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:16px;border-radius:8px;background:linear-gradient(#c9cfd6,#f4f6f8);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.35);outline:none;margin:0}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9ced5 60%,#8e959d);
    border:2px solid #7d858e;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
  .rng::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9ced5 60%,#8e959d);
    border:2px solid #7d858e;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
  .prev{width:64px;height:64px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px #d5dae0}

  .tray{margin-top:14px;height:136px;border-radius:26px;background:linear-gradient(#e6ebf0,#fbfcfd);
    box-shadow:inset 0 5px 12px rgba(0,0,0,.28),inset 0 -2px 4px rgba(255,255,255,.9),0 0 0 3px #f2f5f8;
    display:flex;justify-content:space-around;align-items:flex-end;padding:0 10px;overflow:hidden}
  .brush{width:clamp(26px,7.5vw,54px);height:120px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;transition:transform .15s}
  .brush svg{height:118px;width:auto;pointer-events:none}
  .brush.sel{transform:translateY(-12px);filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}

  .shapeTray{margin-top:12px;border-radius:22px;background:linear-gradient(#e6ebf0,#fbfcfd);
    box-shadow:inset 0 5px 12px rgba(0,0,0,.25),0 0 0 3px #f2f5f8;padding:12px 10px;
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:226px;overflow-y:auto}
  .shp{height:52px;border-radius:12px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:linear-gradient(#fbfcfe,#e7ecf2);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .shp.sel{border-color:#2f9bff;background:#e9f5ff}
  .sh{width:38px;height:38px;fill:#55c2f2;stroke:#12304a;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
  .sh.ln{fill:none;stroke:#111;stroke-width:3.5}
  .fillRow{display:block;margin-top:10px;font-size:13px;color:#555}

  .palette{width:132px;flex:0 0 auto;background:#0b0b0b;border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
    align-content:start;overflow-y:auto;max-height:262px}
  .sw2{aspect-ratio:1;border-radius:7px;cursor:pointer;border:2px solid transparent}
  .sw2.sel{border-color:#fff;box-shadow:0 0 0 2px #2563eb}
  .eye{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#222}
  .eye svg{width:70%;height:70%}

  /* selection bar + poly finish */
  #selBar{position:fixed;display:none;gap:4px;background:#fff;border-radius:12px;padding:5px;box-shadow:0 4px 16px rgba(0,0,0,.6);z-index:15}
  #selBar button{border:0;background:#f1f4f8;border-radius:8px;padding:9px 13px;font:600 14px Segoe UI,Arial,sans-serif;cursor:pointer;color:#222}
  #selBar button:hover{background:#dbeafe}
  #selBar .del{color:#b91c1c}
  #polyDone{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;display:none;z-index:14;border:0;border-radius:22px;padding:10px 20px;
    background:#2f9bff;color:#fff;font:700 15px Segoe UI,Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.6);cursor:pointer}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111;padding:8px 16px;border-radius:20px;
    font-size:14px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;max-width:92vw;text-align:center}
  #toast.show{opacity:1}
  @media (max-width:600px){.palette{width:104px}.sw2{border-radius:5px}}

  /* ---------- Tools panel ---------- */
  .toolGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:6px 14px 6px}
  .secTitle{grid-column:1/-1;font-size:12px;font-weight:700;color:#667;text-transform:uppercase;letter-spacing:.07em;margin:8px 0 0}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:10px 4px 8px;border-radius:12px;
    background:linear-gradient(#fbfcfe,#e7ecf2);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;font-size:12px;font-weight:600;color:#333;text-align:center;line-height:1.15;border:3px solid transparent}
  .tile:hover{background:#eef6ff}
  .tile.on{border-color:#2f9bff;background:#e9f5ff}
  .tile svg{width:42px;height:42px;pointer-events:none}
  .boardRow{display:flex;gap:10px;align-items:center;padding:8px 14px 14px;flex-wrap:wrap}
  .boardRow label{margin-left:10px;font-size:14px}
  /* floating widgets: timer, stopwatch, calculator */
  .wdg{position:fixed;z-index:12;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.65);color:#222;overflow:hidden;min-width:262px;max-width:96vw}
  .wdg .wh{background:#111;color:#fff;padding:7px 10px 7px 14px;display:flex;justify-content:space-between;align-items:center;cursor:move;font-weight:600;font-size:14px;touch-action:none}
  .wdg .wh .x{cursor:pointer;padding:0 4px;font-size:18px}
  .wdg .wb{padding:12px}
  .lcd{background:#0f1720;color:#7cffb2;font:700 34px/1.15 'Courier New',monospace;text-align:right;border-radius:8px;padding:8px 12px;margin-bottom:10px;overflow:hidden;white-space:nowrap}
  .lcd small{display:block;font-size:13px;color:#6fa;min-height:16px;opacity:.75}
  .wbtn{border:0;border-radius:8px;padding:10px 6px;font:700 15px 'Segoe UI',Arial,sans-serif;background:#eef1f5;cursor:pointer;color:#222;flex:1}
  .wbtn:active{background:#cfe3ff}
  .wbtn.op{background:#dbeafe}.wbtn.go{background:#2f9bff;color:#fff}.wbtn.stop{background:#e53935;color:#fff}
  .row2{display:flex;gap:6px;margin-top:6px}
  .row2 .wbtn{white-space:nowrap;padding:10px 4px;font-size:14px}
  .calc{display:grid;grid-template-columns:repeat(4,58px);gap:6px}
  .calc .wbtn{padding:12px 0;font-size:18px}
  .span2{grid-column:span 2}
  .laps{font:600 13px 'Courier New',monospace;margin-top:8px;color:#444;max-height:84px;overflow:auto}
  /* spotlight + screen shade */
  #spot{position:fixed;inset:0;z-index:8;display:none;overflow:hidden;touch-action:none;cursor:move}
  #spotHole{position:absolute;box-shadow:0 0 0 4000px rgba(0,0,0,.9);pointer-events:none}
  #spotCtl{position:fixed;z-index:9;display:none;gap:6px;top:12px;right:12px;background:#fff;border-radius:22px;padding:5px 8px;box-shadow:0 4px 16px rgba(0,0,0,.6)}
  #spotCtl button{border:0;background:#eef1f5;border-radius:16px;padding:7px 12px;font:700 14px 'Segoe UI',Arial,sans-serif;cursor:pointer;color:#222}
  #shade{position:fixed;z-index:8;display:none;background:linear-gradient(#2d3138,#1a1d22);touch-action:none}
  #shade .hd{position:absolute;background:#f4f6f8;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none}
  #shade .hd.top{bottom:10px;left:50%;transform:translateX(-50%);width:140px;height:36px}
  #shade .hd.bottom{top:10px;left:50%;transform:translateX(-50%);width:140px;height:36px}
  #shade .hd.left{right:10px;top:50%;transform:translateY(-50%);width:36px;height:140px;flex-direction:column;padding:10px 0}
  #shade .hd.right{left:10px;top:50%;transform:translateY(-50%);width:36px;height:140px;flex-direction:column;padding:10px 0}
  #shade .gb{cursor:pointer;font-size:17px;padding:2px 4px;user-select:none}
  #shade .grip{font-size:20px;color:#889;pointer-events:none}
  /* laser pointer + magnifier */
  #laserCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;display:none}
  #mag{position:fixed;display:none;z-index:9;pointer-events:none}
  #mag canvas{display:block;border-radius:50%;background:#000;box-shadow:0 8px 28px rgba(0,0,0,.75),0 0 0 4px #f4f6f8,0 0 0 6px #8b96a1}
  #magCtl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:14px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:5px 8px;
    box-shadow:0 4px 16px rgba(0,0,0,.6);pointer-events:auto;white-space:nowrap;touch-action:none}
  #magCtl button{border:0;background:#eef1f5;border-radius:16px;padding:7px 12px;font:700 14px 'Segoe UI',Arial,sans-serif;cursor:pointer;color:#222}
  #magGrip{cursor:move;font:700 14px 'Segoe UI',Arial,sans-serif;color:#223;padding:0 6px;user-select:none}
  #magF{font:700 13px 'Segoe UI',Arial,sans-serif;color:#445;min-width:34px;text-align:center}
  /* dice */
  .diceRow{display:flex;gap:14px;justify-content:center;margin:4px 0 12px}
  .die{width:76px;height:76px;border-radius:15px;background:linear-gradient(#fff,#e9edf2);border:3px solid #222;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
  .die i{border-radius:50%;margin:auto;width:13px;height:13px}
  .die i.p{background:#1b1b1b}
  .die.roll{animation:wob .12s infinite alternate}
  @keyframes wob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  .diceSum{text-align:center;font:700 18px 'Segoe UI',Arial,sans-serif;margin-top:10px;color:#223;min-height:24px}
  /* narrow screens: two-row bar so the three docks never crowd each other */
  @media (max-width:620px){
    #bar{flex-wrap:wrap;justify-content:space-between;gap:6px 8px;align-items:flex-end}
    #bar>#dockMain{order:2;flex:1 0 100%;margin:0;justify-content:center;border-radius:16px 16px 0 0;padding-top:12px}
    #bar>#dockMenu,#bar>#dockPage{order:1;border-radius:14px 14px 0 0;padding-top:6px}
    #bar>#dockMenu{border-radius:0 14px 0 0}#bar>#dockPage{border-radius:14px 0 0 0}
    .pop,.pop.big{bottom:130px}
    .pop.big{max-height:calc(100vh - 150px)}
    #polyDone{bottom:140px}
  }
  #selBar button.sc{font-size:17px;padding:6px 12px}
  @media (max-width:600px){.toolGrid{grid-template-columns:repeat(3,1fr)}.tile svg{width:36px;height:36px}.wdg{min-width:240px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="spot"><div id="spotHole"></div></div>
<div id="spotCtl"><button id="spotMinus" title="Smaller">－</button><button id="spotPlus" title="Bigger">＋</button><button id="spotShape" title="Circle / rectangle">◯ ▭</button><button id="spotX">✕ Close</button></div>
<div id="shade"><div class="hd top" id="shadeHd"><span class="gb" id="shadeSide" title="Move to another side">⟳</span><span class="grip">≡</span><span class="gb" id="shadeX" title="Close">✕</span></div></div>
<canvas id="laserCv"></canvas>
<div id="mag"><canvas id="magCv"></canvas><div id="magCtl"><span id="magGrip" title="Drag to move">✥ Move</span><button id="magMinus" title="Zoom out">－</button><span id="magF">×2.5</span><button id="magPlus" title="Zoom in">＋</button><button id="magX" title="Close">✕</button></div></div>
<input type="file" id="imgIn" accept="image/*" hidden>

<button id="polyDone">✓ Finish shape</button>
<div id="selBar"><button id="selMinus" class="sc" style="display:none" title="Smaller">－</button><button id="selPlus" class="sc" style="display:none" title="Bigger">＋</button><button id="selDup">⧉ Duplicate</button><button id="selDel" class="del">🗑 Delete</button><button id="selX" title="Deselect">✕</button></div>
<input type="color" id="colorIn" style="position:fixed;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px">

<div id="bar">
<!-- ============ BOTTOM LEFT : menu dock ============ -->
<div class="dock" id="dockMenu">
  <button class="btn" id="chev" title="Hide / show menu">
    <svg viewBox="0 0 16 30"><path d="M12 3 L3 15 L12 27" fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn" data-pop="popMenu" title="Menu">
    <svg viewBox="0 0 40 40"><g fill="#3a3f45"><rect x="5" y="6" width="30" height="7" rx="3.5"/><rect x="5" y="17" width="30" height="7" rx="3.5"/><rect x="5" y="28" width="30" height="7" rx="3.5"/></g><g fill="#fff"><circle cx="10" cy="9.5" r="1.8"/><circle cx="10" cy="20.5" r="1.8"/><circle cx="10" cy="31.5" r="1.8"/></g></svg>
  </button>
  <button class="btn" id="btnFull" title="Full screen">
    <svg viewBox="0 0 40 40"><rect x="3" y="5" width="34" height="23" rx="2" fill="#1c8cf0" stroke="#0b5db0" stroke-width="2"/><rect x="5" y="7" width="30" height="8" fill="#6cc0ff" opacity=".6"/><rect x="16" y="28" width="8" height="4" fill="#888"/><rect x="10" y="32" width="20" height="3" rx="1.5" fill="#666"/></svg>
  </button>
  <button class="btn" data-pop="popTools" title="Tools / settings">
    <svg viewBox="0 0 40 40"><path d="M6 33 L22 17" stroke="#444" stroke-width="5" stroke-linecap="round"/><circle cx="26" cy="13" r="8" fill="none" stroke="#555" stroke-width="4"/><path d="M33 33 L17 17" stroke="#b5651d" stroke-width="5" stroke-linecap="round"/><rect x="9" y="5" width="12" height="7" rx="1" transform="rotate(-45 15 8)" fill="#555"/></svg>
  </button>
  <button class="btn" data-pop="popFiles" title="Files / save">
    <svg viewBox="0 0 40 40"><path d="M3 14 h12 l3 4 h19 v16 a2 2 0 0 1 -2 2 h-30 a2 2 0 0 1 -2 -2z" fill="#e8ecf1" stroke="#7b8794" stroke-width="2"/><path d="M12 14 L26 6 L22 10 H34 L30 14" fill="none" stroke="#1c8cf0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn" data-pop="popZoom" title="Zoom / find">
    <svg viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="3" fill="#7fb8ee"/><circle cx="18" cy="18" r="9" fill="#fff" fill-opacity=".55" stroke="#333" stroke-width="3"/><path d="M25 25 L35 35" stroke="#333" stroke-width="5" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- ============ BOTTOM CENTER : tool dock ============ -->
<div class="dock" id="dockMain">
  <button class="btn" data-tool="select" title="Select (drag a circle around things)">
    <svg viewBox="0 0 40 40"><path d="M10 4 L10 31 L17 25 L22 36 L27 34 L22 23 L31 23 Z" fill="#333" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn active" data-tool="pen" title="Pen / brushes">
    <svg viewBox="0 0 40 40"><path d="M20 2 C24 8 26 12 26 16 L14 16 C14 12 16 8 20 2Z" fill="#2ecc4a"/><path d="M14 16 H26 L24 38 H16Z" fill="#3b2a20"/><circle cx="20" cy="26" r="3" fill="#d9a066"/></svg>
  </button>
  <button class="btn" data-tool="eraser" title="Eraser">
    <svg viewBox="0 0 40 40"><g transform="rotate(-35 20 20)"><rect x="4" y="12" width="32" height="16" rx="3" fill="#7fc8ff" stroke="#3b8ed0" stroke-width="2"/><rect x="4" y="12" width="12" height="16" rx="3" fill="#fff" stroke="#9bb" stroke-width="2"/><rect x="18" y="17" width="14" height="6" fill="#fff" opacity=".8"/></g></svg>
  </button>
  <button class="btn" data-tool="shape" title="Shapes &amp; lines">
    <svg viewBox="0 0 40 40" class="sh"><rect x="6" y="6" width="28" height="28" rx="1"/></svg>
  </button>
  <button class="btn" data-tool="pan" title="Move canvas">
    <svg viewBox="0 0 40 40"><path d="M12 22 V10 a2 2 0 0 1 4 0 V18 V7 a2 2 0 0 1 4 0 V18 V8 a2 2 0 0 1 4 0 V19 V12 a2 2 0 0 1 4 0 V26 c0 7 -4 10 -9 10 c-5 0 -7 -3 -10 -8 l-3 -5 a2 2 0 0 1 3 -2 z" fill="#fff" stroke="#555" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 40 40"><path d="M16 8 L4 20 L16 32 V25 C26 25 32 28 36 35 C35 22 28 15 16 15Z" fill="#444"/></svg>
  </button>
  <button class="btn" id="btnRedo" title="Redo (Ctrl+Y)">
    <svg viewBox="0 0 40 40"><path d="M24 8 L36 20 L24 32 V25 C14 25 8 28 4 35 C5 22 12 15 24 15Z" fill="#9a9a9a"/></svg>
  </button>
</div>

<!-- ============ BOTTOM RIGHT : page dock ============ -->
<div class="dock" id="dockPage">
  <button class="btn pbtn" id="btnAdd" title="New page">
    <svg viewBox="0 0 30 30"><path d="M12 3h6v9h9v6h-9v9h-6v-9H3v-6h9z" fill="#111"/></svg>
  </button>
  <button class="btn pbtn" id="btnPrev" title="Previous page">
    <svg viewBox="0 0 30 30"><path d="M22 3 L6 15 L22 27Z" fill="#111"/></svg>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const ink=document.createElement('canvas'),ictx=ink.getContext('2d');   // cached layer holding all committed drawings

/* ================= state ================= */
var mag=null;
let st={tool:'pen',brush:'chinese',color:'#2ecc4a',size:4,lw:4,shape:'rect',fill:false,bg:'dark',grid:true,zoom:1};
let ERS=18;                                   // eraser radius (world units)
const newPage=()=>({objs:[],hist:[[]],hi:0,px:0,py:0});
let pages=[newPage()],cur=0;
let drawing=null,panStart=null,eraserPos=null,lastE=null;
let selObjs=[],selMove=null,lasso=null,hideSet=null;
let polyDraft=null,polyCursor=null,lastTap={t:0,x:0,y:0};
let inkDirty=true,inkState={px:0,py:0,zoom:1,cur:0},fillTouched=false;
const P=()=>pages[cur];

/* ================= helpers ================= */
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function resize(){const d=devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);ink.width=cv.width;ink.height=cv.height;inkDirty=true;draw()}
addEventListener('resize',resize);
function world(e){return{x:(e.clientX-P().px)/st.zoom,y:(e.clientY-P().py)/st.zoom}}
const clone=o=>JSON.parse(JSON.stringify(o));
function snapshot(){const p=P();p.hist=p.hist.slice(0,p.hi+1);p.hist.push(clone(p.objs));p.hi=p.hist.length-1;updUI()}
function undo(){const p=P();if(p.hi>0){p.hi--;p.objs=clone(p.hist[p.hi]);selObjs=[];inkDirty=true;draw();updUI()}}
function redo(){const p=P();if(p.hi<p.hist.length-1){p.hi++;p.objs=clone(p.hist[p.hi]);selObjs=[];inkDirty=true;draw();updUI()}}
function updUI(){
  const atEnd=P().hi>=P().hist.length-1;
  $('btnUndo').classList.toggle('disabled',P().hi<=0);
  $('btnRedo').classList.toggle('disabled',atEnd);
  $('btnRedo').querySelector('path').setAttribute('fill',atEnd?'#9a9a9a':'#444');
  $('pageLabel').textContent=cur+1;
  $('badge').textContent=Math.max(0,pages.length-1-cur);
  $('btnPrev').classList.toggle('disabled',cur===0);
}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const hh=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v)};

/* ================= background grid ================= */
const BG={dark:['#0b0b0b','rgba(255,255,255,.10)'],green:['#0f3d2b','rgba(255,255,255,.12)'],white:['#ffffff','rgba(0,0,0,.14)'],plain:['#1b1b1b','rgba(255,255,255,.08)']};
function drawGrid(){
  const [bg,gc]=BG[st.bg];ctx.fillStyle=bg;ctx.fillRect(0,0,innerWidth,innerHeight);
  if(!st.grid)return;
  const s=48*st.zoom,ox=((P().px%s)+s)%s,oy=((P().py%s)+s)%s;
  ctx.strokeStyle=gc;ctx.lineWidth=1;ctx.beginPath();
  for(let x=ox;x<innerWidth;x+=s){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,innerHeight)}
  for(let y=oy;y<innerHeight;y+=s){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(innerWidth,Math.round(y)+.5)}
  ctx.stroke();
  if(st.bg==='dark'){const g=ctx.createRadialGradient(innerWidth/2,innerHeight/3,100,innerWidth/2,innerHeight/2,innerWidth*.7);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight)}
}

/* ================= brushes ================= */
function eff(o){const s=o.size;switch(o.brush){case 'highlighter':return s*3.5;case 'chinese':return s*2;case 'magic':return s*2+10;case 'spray':return s*2.4+4;case 'calligraphy':return s*1.3;default:return s}}
function starAt(c,x,y,ro,ri,rot){c.beginPath();for(let i=0;i<10;i++){const r=i%2?ri:ro,a=rot+i*Math.PI/5-Math.PI/2;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill()}
// turns the raw pointer points into a smooth curve (4 samples per segment); d = pointer speed at that sample
function smoothPath(p){
  const n=p.length;if(n<3)return p.map((q,i)=>({x:q.x,y:q.y,d:i?Math.hypot(q.x-p[i-1].x,q.y-p[i-1].y):0}));
  const out=[{x:p[0].x,y:p[0].y,d:0}];
  for(let i=1;i<n-1;i++){
    const m={x:(p[i].x+p[i+1].x)/2,y:(p[i].y+p[i+1].y)/2};
    const a=i===1?p[0]:{x:(p[i-1].x+p[i].x)/2,y:(p[i-1].y+p[i].y)/2};
    const d=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    for(let k=1;k<=4;k++){const t=k/4,u=1-t;out.push({x:u*u*a.x+2*u*t*p[i].x+t*t*m.x,y:u*u*a.y+2*u*t*p[i].y+t*t*m.y,d})}
  }
  const l=p[n-1];out.push({x:l.x,y:l.y,d:Math.hypot(l.x-p[n-2].x,l.y-p[n-2].y)});
  return out;
}
function strokeBrush(c,o){
  const p=o.pts,n=p.length,s=o.size,b=o.brush||'pen',oa=c.globalAlpha;
  c.strokeStyle=o.color;c.fillStyle=o.color;c.lineCap='round';c.lineJoin='round';
  const path=()=>{c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<n-1;i++){const m={x:(p[i].x+p[i+1].x)/2,y:(p[i].y+p[i+1].y)/2};c.quadraticCurveTo(p[i].x,p[i].y,m.x,m.y)}c.lineTo(p[n-1].x,p[n-1].y)};
  if(b==='spray'){const R=s*1.2+2;for(let i=0;i<n;i++)for(let k=0;k<5;k++){const a=hh(i*5+k)*6.283,r=Math.sqrt(hh(i*7.3+k*3.1+1))*R;c.beginPath();c.arc(p[i].x+Math.cos(a)*r,p[i].y+Math.sin(a)*r,.9,0,7);c.fill()}return}
  if(b==='magic'){
    if(n>1){c.save();c.globalAlpha=oa*.35;c.lineWidth=Math.max(1,s*.5);c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<n;i++)c.lineTo(p[i].x,p[i].y);c.stroke();c.restore()}
    const R=s*1.2+4,gap=s*3+14;let acc=gap,k=0;
    for(let i=0;i<n;i++){if(i>0)acc+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);if(acc>=gap){acc=0;k++;starAt(c,p[i].x,p[i].y,R,R*.45,hh(k)*1.2)}}
    return}
  if(n===1){c.beginPath();c.arc(p[0].x,p[0].y,b==='chinese'?s*.9:b==='highlighter'?s*1.75:s/2,0,7);if(b==='highlighter')c.globalAlpha=oa*.4;c.fill();c.globalAlpha=oa;return}
  if(b==='highlighter'){c.globalAlpha=oa*.4;c.lineWidth=s*3.5;c.lineCap='square';path();c.stroke();c.globalAlpha=oa;return}
  if(b==='pencil'){c.globalAlpha=oa*.8;c.lineWidth=s*.8;path();c.stroke();
    c.save();c.translate(.7,.5);c.globalAlpha=oa*.35;c.lineWidth=s*.7;path();c.stroke();c.restore();c.globalAlpha=oa;return}
  if(b==='calligraphy'){const sp=smoothPath(p);for(let i=1;i<sp.length;i++){const a=Math.atan2(sp[i].y-sp[i-1].y,sp[i].x-sp[i-1].x);
    c.lineWidth=Math.max(.8,s*(.3+1.0*Math.abs(Math.sin(a-.8))));c.beginPath();c.moveTo(sp[i-1].x,sp[i-1].y);c.lineTo(sp[i].x,sp[i].y);c.stroke()}return}
  if(b==='chinese'){   // smooth writing brush: curve smoothing + gentle speed-based width + tapered ends
    const sp=smoothPath(p),m=sp.length;let w=s;
    for(let i=1;i<m;i++){
      const t=Math.max(.6,Math.min(1.7,1.7-sp[i].d*.09));w=w*.9+s*t*.1;
      const tf=.3+.7*Math.min(1,i/20,(m-1-i)/28);
      c.lineWidth=Math.max(.8,w*tf);c.beginPath();c.moveTo(sp[i-1].x,sp[i-1].y);c.lineTo(sp[i].x,sp[i].y);c.stroke();
    }
    return}
  c.lineWidth=s;path();c.stroke();   // plain pen (used for the freehand curve shape)
}

/* ================= shapes ================= */
const PN={
  triangle:[[.5,0],[1,1],[0,1]],rtriangle:[[0,0],[0,1],[1,1]],trapezoid:[[.25,0],[.75,0],[1,1],[0,1]],
  parallelogram:[[.25,0],[1,0],[.75,1],[0,1]],diamond:[[.5,0],[1,.5],[.5,1],[0,.5]],
  pentagon:[[.5,0],[1,.38],[.82,1],[.18,1],[0,.38]],hexagon:[[.25,0],[.75,0],[1,.5],[.75,1],[.25,1],[0,.5]],
  plus:[[.35,0],[.65,0],[.65,.35],[1,.35],[1,.65],[.65,.65],[.65,1],[.35,1],[.35,.65],[0,.65],[0,.35],[.35,.35]]
};
PN.rtri=PN.rtriangle;
PN.star=(()=>{const a=[];for(let i=0;i<10;i++){const r=i%2?.2:.5,g=-Math.PI/2+i*Math.PI/5;a.push([.5+Math.cos(g)*r,.5+Math.sin(g)*r])}return a})();
const NOFILL=['line','dotted','dashed','arrow','darrow','axes','numline','brace'];
function rrect(c,x,y,w,h,r){c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
function head(c,x,y,a,L){c.moveTo(x,y);c.lineTo(x-L*Math.cos(a-.45),y-L*Math.sin(a-.45));c.moveTo(x,y);c.lineTo(x-L*Math.cos(a+.45),y-L*Math.sin(a+.45))}
function shapeDraw(c,o){
  const {x1,y1,x2,y2,s}=o,w=x2-x1,h=y2-y1,aw=Math.abs(w),ah=Math.abs(h),X=u=>x1+w*u,Y=v=>y1+h*v;
  c.beginPath();
  if(PN[s]){PN[s].forEach((q,i)=>c[i?'lineTo':'moveTo'](X(q[0]),Y(q[1])));c.closePath()}
  else switch(s){
    case 'rect':c.rect(x1,y1,w,h);break;
    case 'rrect':rrect(c,Math.min(x1,x2),Math.min(y1,y2),aw,ah,Math.min(aw,ah)*.2);break;
    case 'circle':case 'ellipse':c.ellipse(x1+w/2,y1+h/2,aw/2,ah/2,0,0,7);break;
    case 'semicircle':c.ellipse(x1+w/2,Math.max(y1,y2),aw/2,ah,0,Math.PI,2*Math.PI);c.closePath();break;
    case 'heart':c.moveTo(X(.5),Y(.95));c.bezierCurveTo(X(-.15),Y(.55),X(.1),Y(-.1),X(.5),Y(.25));c.bezierCurveTo(X(.9),Y(-.1),X(1.15),Y(.55),X(.5),Y(.95));c.closePath();break;
    case 'cube':[[0,.25],[.25,0],[1,0],[1,.75],[.75,1],[0,1]].forEach((q,i)=>c[i?'lineTo':'moveTo'](X(q[0]),Y(q[1])));c.closePath();
      c.moveTo(X(0),Y(.25));c.lineTo(X(.75),Y(.25));c.lineTo(X(.75),Y(1));c.moveTo(X(.75),Y(.25));c.lineTo(X(1),Y(0));break;
    case 'cylinder':c.ellipse(X(.5),Y(.12),aw/2,ah*.12,0,0,7);c.moveTo(X(0),Y(.12));c.lineTo(X(0),Y(.88));c.ellipse(X(.5),Y(.88),aw/2,ah*.12,0,Math.PI,0,true);c.lineTo(X(1),Y(.12));break;
    case 'cone':c.moveTo(X(.5),Y(0));c.lineTo(X(0),Y(.88));c.ellipse(X(.5),Y(.88),aw/2,ah*.12,0,Math.PI,0,true);c.closePath();break;
    case 'line':c.moveTo(x1,y1);c.lineTo(x2,y2);break;
    case 'dotted':c.moveTo(x1,y1);c.lineTo(x2,y2);c.setLineDash([.1,o.size*2.2+3]);break;
    case 'dashed':c.moveTo(x1,y1);c.lineTo(x2,y2);c.setLineDash([o.size*3+6,o.size*2+5]);c.lineCap='butt';break;
    case 'arrow':case 'darrow':{c.moveTo(x1,y1);c.lineTo(x2,y2);const a=Math.atan2(y2-y1,x2-x1),L=14+o.size*2;head(c,x2,y2,a,L);if(s==='darrow')head(c,x1,y1,a+Math.PI,L);break}
    case 'axes':{const sg=Math.sign(w)||1,tg=Math.sign(h)||1;c.moveTo(X(0),Y(.5));c.lineTo(X(1),Y(.5));c.moveTo(X(.5),Y(1));c.lineTo(X(.5),Y(0));
      c.moveTo(X(1)-12*sg,Y(.5)-7);c.lineTo(X(1),Y(.5));c.lineTo(X(1)-12*sg,Y(.5)+7);c.moveTo(X(.5)-7,Y(0)+12*tg);c.lineTo(X(.5),Y(0));c.lineTo(X(.5)+7,Y(0)+12*tg);break}
    case 'numline':{const a=Y(.5),t=Math.max(6,ah/2),sg=Math.sign(w)||1;c.moveTo(x1,a);c.lineTo(x2,a);
      for(let i=1;i<10;i++){c.moveTo(X(i/10),a-t/2);c.lineTo(X(i/10),a+t/2)}
      c.moveTo(x2-12*sg,a-7);c.lineTo(x2,a);c.lineTo(x2-12*sg,a+7);c.moveTo(x1+12*sg,a-7);c.lineTo(x1,a);c.lineTo(x1+12*sg,a+7);break}
    case 'brace':c.moveTo(X(0),Y(1));c.quadraticCurveTo(X(0),Y(.5),X(.25),Y(.5));c.lineTo(X(.4),Y(.5));c.quadraticCurveTo(X(.5),Y(.5),X(.5),Y(0));
      c.quadraticCurveTo(X(.5),Y(.5),X(.6),Y(.5));c.lineTo(X(.75),Y(.5));c.quadraticCurveTo(X(1),Y(.5),X(1),Y(1));break;
  }
  if(o.fill&&!NOFILL.includes(s)){c.globalAlpha=.35;c.fill();c.globalAlpha=1}
  c.stroke();
}
function polyDraw(c,o){
  const p=o.pts;if(p.length<2)return;
  c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)c.lineTo(p[i].x,p[i].y);if(o.closed)c.closePath();
  if(o.fill&&o.closed){c.globalAlpha=.35;c.fill();c.globalAlpha=1}
  if(o.dash==='dashed'){c.setLineDash([o.size*3+6,o.size*2+5]);c.lineCap='butt'}
  c.stroke();
}

/* ================= magic-fill images ================= */
const fillCache=new Map(),eraseWork=new Map();
function getFill(o){
  const w=eraseWork.get(o);if(w)return w;
  const k=fillCache.get(o.src);if(k)return k.cv;
  const e={cv:null};fillCache.set(o.src,e);
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);e.cv=c;inkDirty=true;draw()};im.src=o.src;
  return null;
}
function fillWork(o){let w=eraseWork.get(o);if(!w){const b=getFill(o);if(!b)return null;w=document.createElement('canvas');w.width=b.width;w.height=b.height;w.getContext('2d').drawImage(b,0,0);eraseWork.set(o,w)}return w}
function commitEraseFills(){eraseWork.forEach((cvs,o)=>{const src=cvs.toDataURL('image/png');fillCache.set(src,{cv:cvs});o.src=src});eraseWork.clear()}

/* ================= drawing any object ================= */
function pathObj(c,o){
  if(o.t==='fill'){const k=getFill(o);if(k)c.drawImage(k,o.x,o.y,o.w,o.h);return}
  if(o.t==='text'){drawText(c,o);return}
  if(o.t==='img'){const im=getImg(o.id);if(im)c.drawImage(im,o.x,o.y,o.w,o.h);return}
  if(o.t==='stamp'){c.save();c.translate(o.x,o.y);c.rotate(o.rot);c.scale(o.k,o.k);drawBody(c,o,false);c.restore();return}
  c.strokeStyle=o.color;c.fillStyle=o.color;c.lineWidth=o.size;c.lineCap='round';c.lineJoin='round';c.globalAlpha=o.alpha||1;
  if(o.t==='stroke')strokeBrush(c,o);else if(o.t==='poly')polyDraw(c,o);else shapeDraw(c,o);
  c.setLineDash([]);c.globalAlpha=1;
}
function bbox(o){
  if(o.t==='fill'||o.t==='img')return{x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.t==='text')return textBox(o);
  if(o.t==='stamp'){const q=stampPoly(o);let a=1e9,b=1e9,c=-1e9,d=-1e9;q.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)});return{x:a-4,y:b-4,w:c-a+8,h:d-b+8}}

    const m=o.t==='stroke'?eff(o):o.size;return{x:a-m,y:b-m,w:c-a+2*m,h:d-b+2*m}}

  return{x:Math.min(o.x1,o.x2)-m,y:Math.min(o.y1,o.y2)-m,w:Math.abs(o.x2-o.x1)+2*m,h:Math.abs(o.y2-o.y1)+2*m};
}

/* ================= cached ink layer + main draw ================= */
function rebuildInk(){
  const d=devicePixelRatio||1,pg=P();
  ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,ink.width,ink.height);
  ictx.setTransform(d*st.zoom,0,0,d*st.zoom,d*pg.px,d*pg.py);
  for(const o of pg.objs){if(hideSet&&hideSet.has(o))continue;pathObj(ictx,o)}
  inkState={px:pg.px,py:pg.py,zoom:st.zoom,cur};inkDirty=false;
}
function inkStale(){const pg=P();return inkState.cur!==cur||inkState.zoom!==st.zoom||inkState.px!==pg.px||inkState.py!==pg.py}
function inkAdd(o){   // add one finished object without redrawing everything
  if(inkDirty||inkStale()){inkDirty=true;return}
  const d=devicePixelRatio||1,pg=P();ictx.setTransform(d*st.zoom,0,0,d*st.zoom,d*pg.px,d*pg.py);pathObj(ictx,o);
}
function draw(){
  const d=devicePixelRatio||1,pg=P();
  ctx.setTransform(d,0,0,d,0,0);
  drawGrid();
  if(inkDirty||(inkStale()&&!panStart))rebuildInk();
  ctx.drawImage(ink,panStart?pg.px-inkState.px:0,panStart?pg.py-inkState.py:0,innerWidth,innerHeight);
  ctx.save();ctx.translate(pg.px,pg.py);ctx.scale(st.zoom,st.zoom);
  if(hideSet)hideSet.forEach(o=>pathObj(ctx,o));
  if(drawing&&drawing.t!=='eraser')pathObj(ctx,drawing);
  if(instDrag&&instDrag.stroke)pathObj(ctx,instDrag.stroke);
  if(polyDraft&&polyCursor){
    pathObj(ctx,Object.assign({},polyDraft,{pts:[...polyDraft.pts,polyCursor],closed:false}));
    ctx.fillStyle='#fff';polyDraft.pts.forEach(q=>{ctx.beginPath();ctx.arc(q.x,q.y,4/st.zoom,0,7);ctx.fill()});
  }
  if(selObjs.length&&st.tool==='select'&&!lasso){const b=selBBox(),pd=6/st.zoom;
    ctx.strokeStyle='#2f9bff';ctx.lineWidth=1.8/st.zoom;ctx.setLineDash([7/st.zoom,5/st.zoom]);ctx.strokeRect(b.x-pd,b.y-pd,b.w+2*pd,b.h+2*pd);ctx.setLineDash([])}
  if(lasso&&lasso.length>1){ctx.beginPath();lasso.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();
    ctx.fillStyle='rgba(47,155,255,.14)';ctx.fill();ctx.strokeStyle='#2f9bff';ctx.lineWidth=3/st.zoom;ctx.lineJoin='round';ctx.stroke()}
  if(st.tool==='eraser'&&eraserPos){ctx.beginPath();ctx.arc(eraserPos.x,eraserPos.y,ERS,0,7);
    ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=3.5/st.zoom;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.5/st.zoom;ctx.stroke()}
  ctx.restore();
  drawInsts(ctx);
  updSelUI();
  if(mag)updMag();
}

/* ================= selection (lasso) ================= */
function selBBox(){if(!selObjs.length)return null;let a=1e9,b=1e9,c=-1e9,d=-1e9;
  selObjs.forEach(o=>{const r=bbox(o);a=Math.min(a,r.x);b=Math.min(b,r.y);c=Math.max(c,r.x+r.w);d=Math.max(d,r.y+r.h)});return{x:a,y:b,w:c-a,h:d-b}}
function shift(o,dx,dy){
  if(o.t==='stroke'||o.t==='poly')o.pts.forEach(q=>{q.x+=dx;q.y+=dy});
  else if(o.t==='fill'||o.t==='text'||o.t==='img'||o.t==='stamp'){o.x+=dx;o.y+=dy}
  else{o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}
}
function samplePts(o){
  if(o.t==='stroke'||o.t==='poly'){const st2=Math.max(1,Math.ceil(o.pts.length/40));return o.pts.filter((q,i)=>i%st2===0)}
  const b=bbox(o),r=[];for(let i=0;i<=2;i++)for(let j=0;j<=2;j++)r.push({x:b.x+b.w*i/2,y:b.y+b.h*j/2});return r;
}
function hitIdx(p){
  const z=st.zoom,pad=8/z,os=P().objs;
  for(let i=os.length-1;i>=0;i--){const o=os[i];
    if(o.t==='stroke'||o.t==='poly'){const r=(o.t==='stroke'?eff(o):o.size)/2+pad;
      if(o.pts.length===1){if(Math.hypot(o.pts[0].x-p.x,o.pts[0].y-p.y)<r)return i}
      else for(let k=1;k<o.pts.length;k++)if(segDist(p,o.pts[k-1],o.pts[k])<r)return i;
      if(o.t==='poly'&&o.closed&&o.fill&&inPoly(p,o.pts))return i;
    }else{const b=bbox(o);if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return i}
  }
  return null;
}
function selDown(p){
  const b=selBBox();
  if(b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){selMove={x:p.x,y:p.y,moved:false};hideSet=new Set(selObjs);inkDirty=true;draw();return}
  selObjs=[];lasso=[p];draw();
}
function pickLasso(l){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;l.forEach(q=>{a=Math.min(a,q.x);b=Math.min(b,q.y);c=Math.max(c,q.x);d=Math.max(d,q.y)});
  const z=st.zoom;
  if(l.length<4||(c-a<8/z&&d-b<8/z)){const i=hitIdx(l[0]);selObjs=i==null?[]:[P().objs[i]];return}
  selObjs=P().objs.filter(o=>{const pts=samplePts(o);let n=0;pts.forEach(q=>{if(inPoly(q,l))n++});return n>=Math.max(1,pts.length*.5)});
}
function selUp(){
  if(selMove){const m=selMove.moved;selMove=null;hideSet=null;inkDirty=true;if(m)snapshot();draw();return}
  if(lasso){const l=lasso;lasso=null;pickLasso(l);draw()}
}
function updSelUI(){
  const bar=$('selBar'),b=(selObjs.length&&st.tool==='select'&&!lasso&&!selMove)?selBBox():null;
  if(!b){bar.style.display='none';return}
  const pg=P(),z=st.zoom;bar.style.display='flex';const scl=selObjs.some(o=>o.t==='img'||o.t==='text');$('selPlus').style.display=$('selMinus').style.display=scl?'':'none';
  const bw=bar.offsetWidth,bh=bar.offsetHeight;
  let left=pg.px+(b.x+b.w/2)*z-bw/2,top=pg.py+b.y*z-bh-14;
  if(top<8)top=pg.py+(b.y+b.h)*z+14;
  left=Math.max(8,Math.min(innerWidth-bw-8,left));top=Math.max(8,Math.min(innerHeight-bh-($('bar').offsetHeight+10),top));
  bar.style.left=left+'px';bar.style.top=top+'px';
}
$('selDup').onclick=()=>{
  const cp=selObjs.map(o=>{const c=clone(o);shift(c,28/st.zoom,28/st.zoom);return c});
  P().objs.push(...cp);selObjs=cp;inkDirty=true;snapshot();draw();
};
$('selDel').onclick=()=>{const s=new Set(selObjs);P().objs=P().objs.filter(o=>!s.has(o));selObjs=[];inkDirty=true;snapshot();draw()};
$('selX').onclick=()=>{selObjs=[];draw()};

/* ================= eraser (cuts strokes, removes shapes, erases fills) ================= */
function shapeHit(o,e,r){
  const s=o.s,x0=Math.min(o.x1,o.x2),y0=Math.min(o.y1,o.y2),x1=Math.max(o.x1,o.x2),y1=Math.max(o.y1,o.y2),a={x:o.x1,y:o.y1},b={x:o.x2,y:o.y2};
  if(['line','dotted','dashed','arrow','darrow'].includes(s))return segDist(e,a,b)<r+o.size/2;
  if(s==='axes')return segDist(e,{x:x0,y:(y0+y1)/2},{x:x1,y:(y0+y1)/2})<r||segDist(e,{x:(x0+x1)/2,y:y0},{x:(x0+x1)/2,y:y1})<r;
  if(s==='numline')return segDist(e,{x:x0,y:(y0+y1)/2},{x:x1,y:(y0+y1)/2})<r+o.size;
  if(e.x<x0-r||e.x>x1+r||e.y<y0-r||e.y>y1+r)return false;
  if(o.fill&&!NOFILL.includes(s))return true;
  return !(e.x>x0+r&&e.x<x1-r&&e.y>y0+r&&e.y<y1-r);
}
function eraseObj(o,e){
  if(o.t==='text'||o.t==='img'){const b=bbox(o),m=ERS*.3;return(e.x>=b.x-m&&e.x<=b.x+b.w+m&&e.y>=b.y-m&&e.y<=b.y+b.h+m)?[]:o}
  if(o.t==='stamp'){const pl=stampPoly(o);for(let k=0;k<pl.length;k++)if(segDist(e,pl[k],pl[(k+1)%pl.length])<ERS+3)return[];return o}
  if(o.t==='fill'){
    const r=ERS;if(e.x<o.x-r||e.x>o.x+o.w+r||e.y<o.y-r||e.y>o.y+o.h+r)return o;
    const w=fillWork(o);if(!w)return o;
    const g=w.getContext('2d'),kx=w.width/o.w,ky=w.height/o.h;
    g.save();g.globalCompositeOperation='destination-out';g.beginPath();g.ellipse((e.x-o.x)*kx,(e.y-o.y)*ky,r*kx,r*ky,0,0,7);g.fill();g.restore();
    fillTouched=true;return o;
  }
  if(o.t==='stroke'){
    const rr=ERS+eff(o)/2,pts=o.pts,n=pts.length;
    if(n===1)return Math.hypot(pts[0].x-e.x,pts[0].y-e.y)<rr?[]:o;
    const bb=bbox(o);if(e.x<bb.x-ERS||e.x>bb.x+bb.w+ERS||e.y<bb.y-ERS||e.y>bb.y+bb.h+ERS)return o;
    const runs=[];let run=[],touched=false;
    for(let i=0;i<n;i++){
      const q=pts[i];
      if(Math.hypot(q.x-e.x,q.y-e.y)<rr){touched=true;if(run.length){runs.push(run);run=[]}continue}
      run.push(q);
      if(i<n-1&&segDist(e,q,pts[i+1])<rr){touched=true;runs.push(run);run=[]}
    }
    if(run.length)runs.push(run);
    if(!touched)return o;
    return runs.filter(r=>r.length>=2).map(r=>Object.assign({},o,{pts:r.map(q=>({x:q.x,y:q.y}))}));
  }
  if(o.t==='poly'){
    const r=ERS+o.size/2;let hit=false;
    for(let k=1;k<o.pts.length&&!hit;k++)if(segDist(e,o.pts[k-1],o.pts[k])<r)hit=true;
    if(!hit&&o.closed&&(segDist(e,o.pts[o.pts.length-1],o.pts[0])<r||(o.fill&&inPoly(e,o.pts))))hit=true;
    return hit?[]:o;
  }
  return shapeHit(o,e,ERS)?[]:o;
}
function eraseAt(p,prev){
  const samples=[];
  if(prev){const d=Math.hypot(p.x-prev.x,p.y-prev.y),n=Math.max(1,Math.ceil(d/(ERS/2)));for(let i=1;i<=n;i++)samples.push({x:prev.x+(p.x-prev.x)*i/n,y:prev.y+(p.y-prev.y)*i/n})}
  else samples.push(p);
  let changed=false;const out=[];
  for(const o of P().objs){
    let curList=[o];
    for(const e of samples){
      const next=[];
      for(const q of curList){const r=eraseObj(q,e);if(r===q)next.push(q);else{changed=true;next.push(...r)}}
      curList=next;if(!curList.length)break;
    }
    out.push(...curList);
  }
  if(changed||fillTouched){if(changed)P().objs=out;inkDirty=true;drawing.changed=true;fillTouched=false}
}

/* ================= magic pen: flood fill closed areas ================= */
function magicFill(cx,cy){
  const d=devicePixelRatio||1,W=ink.width,H=ink.height,pg=P();
  if(inkDirty||inkStale())rebuildInk();
  const dat=ictx.getImageData(0,0,W,H).data;
  const sx=Math.min(W-1,Math.max(0,Math.round(cx*d))),sy=Math.min(H-1,Math.max(0,Math.round(cy*d)));
  const s0=(sy*W+sx)*4,sr=dat[s0],sg=dat[s0+1],sb=dat[s0+2],sa=dat[s0+3];
  const match=i=>{const a=dat[i+3];if(sa<20)return a<=20;return Math.abs(a-sa)<=40&&Math.abs(dat[i]-sr)+Math.abs(dat[i+1]-sg)+Math.abs(dat[i+2]-sb)<=60};
  const mask=new Uint8Array(W*H),stack=[sy*W+sx];mask[sy*W+sx]=1;
  let minX=sx,maxX=sx,minY=sy,maxY=sy,leak=false,cnt=0;
  while(stack.length){
    const pos=stack.pop(),x=pos%W,y=(pos-x)/W;cnt++;
    if(x<=1||y<=1||x>=W-2||y>=H-2){leak=true;break}
    if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
    let n=pos-1;if(!mask[n]&&match(n*4)){mask[n]=1;stack.push(n)}
    n=pos+1;if(!mask[n]&&match(n*4)){mask[n]=1;stack.push(n)}
    n=pos-W;if(!mask[n]&&match(n*4)){mask[n]=1;stack.push(n)}
    n=pos+W;if(!mask[n]&&match(n*4)){mask[n]=1;stack.push(n)}
  }
  if(leak){toast('That area is not closed — draw a closed shape first');return}
  if(cnt<6){toast('Tap inside a closed area to fill it');return}
  const pad=2,bx=Math.max(0,minX-pad),by=Math.max(0,minY-pad),bw=Math.min(W-1,maxX+pad)-bx+1,bh=Math.min(H-1,maxY+pad)-by+1;
  const ring=new Uint8Array(bw*bh);
  const nb=(x,y)=>x>=0&&y>=0&&x<bw&&y<bh&&(mask[(by+y)*W+bx+x]===1||ring[y*bw+x]===1);
  for(let it=0;it<2;it++){   // widen the fill by 2px under the anti-aliased edge of the lines so no gap shows
    const add=[];
    for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
      const k=y*bw+x,gp=(by+y)*W+bx+x;if(ring[k]||mask[gp])continue;
      const a=dat[gp*4+3];if(a<=10||a>=255)continue;
      if(nb(x-1,y)||nb(x+1,y)||nb(x,y-1)||nb(x,y+1))add.push(k);
    }
    add.forEach(k=>ring[k]=1);
  }
  const [fr,fg,fb]=hexRgb(st.color),out=new ImageData(bw,bh),od=out.data;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    const k=y*bw+x,gp=(by+y)*W+bx+x,o=k*4;
    if(mask[gp]){od[o]=fr;od[o+1]=fg;od[o+2]=fb;od[o+3]=255}
    else if(ring[k]){od[o]=fr;od[o+1]=fg;od[o+2]=fb;od[o+3]=255-dat[gp*4+3]}
  }
  const oc=document.createElement('canvas');oc.width=bw;oc.height=bh;oc.getContext('2d').putImageData(out,0,0);
  const src=oc.toDataURL('image/png');fillCache.set(src,{cv:oc});
  const obj={t:'fill',x:(bx/d-pg.px)/st.zoom,y:(by/d-pg.py)/st.zoom,w:bw/d/st.zoom,h:bh/d/st.zoom,src,color:st.color};
  pg.objs.push(obj);inkAdd(obj);snapshot();draw();
}

/* ================= polygon / polyline (click corners) ================= */
function polyDown(e,p){
  const now=Date.now();
  if(polyDraft&&now-lastTap.t<400&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<22){finishPoly();return}
  lastTap={t:now,x:e.clientX,y:e.clientY};
  if(!polyDraft)polyDraft={t:'poly',pts:[p],closed:st.shape==='polygon',color:st.color,size:st.lw,fill:st.fill,dash:st.shape==='dpolyline'?'dashed':'solid'};
  else polyDraft.pts.push(p);
  polyCursor=p;$('polyDone').style.display='block';draw();
}
function finishPoly(){
  if(!polyDraft)return;
  const o=polyDraft;polyDraft=null;$('polyDone').style.display='none';
  const q=[];o.pts.forEach(pt=>{const l=q[q.length-1];if(!l||Math.hypot(pt.x-l.x,pt.y-l.y)>3/st.zoom)q.push(pt)});o.pts=q;
  if(q.length>=(o.closed?3:2)){P().objs.push(o);inkAdd(o);snapshot()}
  draw();
}
function cancelPoly(){polyDraft=null;$('polyDone').style.display='none';draw()}
$('polyDone').onclick=finishPoly;

/* ================= pointer input ================= */
const POLY=['polygon','polyline','dpolyline'];
cv.addEventListener('pointerdown',e=>{
  closePops();cv.setPointerCapture(e.pointerId);
  snapLine=null;
  const hit=instPick(e.clientX,e.clientY);
  if(hit){
    insts.splice(insts.indexOf(hit.i),1);insts.push(hit.i);
    if(hit.part==='btn'){instBtn(hit,e);return}
    if(hit.part==='cmove'){instDrag={mode:'cmove',inst:hit.i,lx:e.clientX,ly:e.clientY};return}
    if(hit.part==='cpen'){const g=cmp(hit.i);instDrag={mode:'cpen',inst:hit.i};
      if(hit.i.draw)instDrag.stroke={t:'stroke',pts:[s2w(g.Q.x,g.Q.y)],color:st.color,size:Math.max(2,st.size),brush:'pen'};
      draw();return}
    if(hit.part==='edge'&&canSnap()){
      const ctr=hit.i.kind==='protractor'?toScr(hit.i,0,-hit.i.R*.45):{x:hit.i.x,y:hit.i.y};
      const dx=hit.b.x-hit.a.x,dy=hit.b.y-hit.a.y,l=Math.hypot(dx,dy)||1;let nx=-dy/l,ny=dx/l;
      if(nx*(ctr.x-hit.a.x)+ny*(ctr.y-hit.a.y)>0){nx=-nx;ny=-ny}          // normal pointing away from the instrument body
      const w=st.tool==='pen'?eff({brush:st.brush,size:st.size}):st.lw;
      snapLine={a:hit.a,b:hit.b,n:{x:nx,y:ny},off:(w/2+.5)*st.zoom};
    }
    else{instDrag={mode:'move',inst:hit.i,ox:e.clientX-hit.i.x,oy:e.clientY-hit.i.y};return}
  }
  const p=snapLine?snapW(e):world(e);
  if(st.tool==='text'){startText(e.clientX,e.clientY);return}
  if(st.tool==='laser'){laserPush(e);return}
  if(st.tool==='pan'){panStart={x:e.clientX,y:e.clientY,px:P().px,py:P().py};return}
  if(st.tool==='select'){selDown(p);return}
  if(st.tool==='eraser'){drawing={t:'eraser',changed:false};eraserPos=p;eraseAt(p,null);lastE=p;draw();return}
  if(st.tool==='pen'&&st.brush==='fill'){magicFill(e.clientX,e.clientY);return}
  if(st.tool==='shape'&&POLY.includes(st.shape)){polyDown(e,p);return}
  if(st.tool==='pen'||(st.tool==='shape'&&st.shape==='curve')){
    const pen=st.tool==='pen';
    drawing={t:'stroke',pts:[p],color:st.color,size:pen?st.size:st.lw,brush:pen?st.brush:'pen'};
  }else{
    drawing={t:'shape',s:st.shape,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:st.color,size:st.lw,fill:st.fill};
  }
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(instDrag){instMove(e);return}
  if(st.tool==='laser'){laserPush(e);return}
  let p=world(e);if(snapLine&&drawing)p=snapW(e);
  if(panStart){P().px=panStart.px+e.clientX-panStart.x;P().py=panStart.py+e.clientY-panStart.y;draw();return}
  if(st.tool==='select'){
    if(selMove){const dx=p.x-selMove.x,dy=p.y-selMove.y;selMove.x=p.x;selMove.y=p.y;selMove.moved=true;selObjs.forEach(o=>shift(o,dx,dy));draw()}
    else if(lasso){const l=lasso[lasso.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>2/st.zoom){lasso.push(p);draw()}}
    return;
  }
  if(st.tool==='eraser'){eraserPos=p;if(drawing){eraseAt(p,lastE);lastE=p}draw();return}
  if(polyDraft){polyCursor=p;draw();return}
  if(!drawing)return;
  if(drawing.t==='stroke'){const l=drawing.pts[drawing.pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>1.2)drawing.pts.push(p)}
  else{
    drawing.x2=p.x;drawing.y2=p.y;
    const sq=(e.shiftKey&&!['line','arrow','darrow','dotted','dashed'].includes(drawing.s))||drawing.s==='circle';
    if(sq){const s=Math.max(Math.abs(p.x-drawing.x1),Math.abs(p.y-drawing.y1));drawing.x2=drawing.x1+s*(Math.sign(p.x-drawing.x1)||1);drawing.y2=drawing.y1+s*(Math.sign(p.y-drawing.y1)||1)}
  }

/* ---------- instrument geometry ---------- */
function sqVerts(i){
  const s=i.s,h=i.kind==='sq30'?s/Math.sqrt(3):s,cx=s/3,cy=2*h/3;
  return[[0,h],[s,h],[0,0]].map(([x,y])=>{x-=cx;y-=cy;return{x:i.flip?-x:x,y}});
}
function localPoly(i){
  if(i.kind==='ruler')return[{x:-i.L/2,y:-i.H/2},{x:i.L/2,y:-i.H/2},{x:i.L/2,y:i.H/2},{x:-i.L/2,y:i.H/2}];
  if(i.kind==='protractor'){const a=[{x:-i.R,y:0}];for(let k=1;k<24;k++){const t=Math.PI-Math.PI*k/24;a.push({x:i.R*Math.cos(t),y:-i.R*Math.sin(t)})}a.push({x:i.R,y:0});return a}
  return sqVerts(i);
}
function stampPoly(o){const c=Math.cos(o.rot),s=Math.sin(o.rot);return localPoly(o).map(p=>({x:o.x+(p.x*c-p.y*s)*o.k,y:o.y+(p.x*s+p.y*c)*o.k}))}
function bodyHit(i,l){
  if(i.kind==='ruler')return Math.abs(l.x)<=i.L/2&&Math.abs(l.y)<=i.H/2;
  if(i.kind==='protractor')return l.y<=4&&Math.hypot(l.x,l.y)<=i.R;
  return inPoly(l,sqVerts(i));
}
function edgesOf(i){
  if(i.kind==='ruler'){const y=i.flip?i.H/2:-i.H/2;return[[{x:-i.L/2,y},{x:i.L/2,y}]]}
  if(i.kind==='protractor')return[[{x:-i.R,y:0},{x:i.R,y:0}]];
  const v=sqVerts(i);return[[v[0],v[1]],[v[0],v[2]],[v[1],v[2]]];
}
function btnsOf(i){
  const b=(id,x,y,w=28,label='')=>({id,x,y,w,h:28,label});
  if(i.kind==='ruler'){const y=i.flip?-16:16;return[b('close',-i.L/2+26,y),b('flip',i.L/2-62,y),b('rot',i.L/2-26,y)]}
  if(i.kind==='protractor'){const R=i.R;return[b('close',-.3*R,-.3*R),b('rot',-.3*R,-.1*R,58,'ang'),b('flip',.18*R,-.1*R),b('ok',.38*R,-.1*R)]}
  return[b('close',-50,72),b('rot',0,72,58,'ang'),b('flip',50,72),b('ok',0,32)];

/* ---------- drawing the instruments ---------- */
function drawBody(c,i,live){
  c.save();c.lineJoin='round';
  if(i.kind==='ruler'){
    const L=i.L,H=i.H,top=i.flip?H/2:-H/2,dir=i.flip?-1:1;
    c.beginPath();rrect(c,-L/2,-H/2,L,H,10);
    const g=c.createLinearGradient(0,-H/2,0,H/2);g.addColorStop(0,'#f3f5f8');g.addColorStop(1,'#ccd3da');
    c.fillStyle=g;c.globalAlpha=.97;c.fill();c.globalAlpha=1;c.strokeStyle='#8b96a1';c.lineWidth=1.2;c.stroke();
    const m=14,n=Math.floor((L-2*m)/PXCM*10);
    c.strokeStyle='#37424d';c.fillStyle='#37424d';c.lineWidth=1;c.beginPath();
    for(let k=0;k<=n;k++){const x=-L/2+m+k*PXCM/10,len=k%10===0?16:k%5===0?11:6;c.moveTo(x,top);c.lineTo(x,top+dir*len)}
    c.stroke();c.font='11px Segoe UI,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';
    for(let k=0;k<=n;k+=10)c.fillText(String(k/10),-L/2+m+k*PXCM/10,top+dir*27);
    if(live){const y=i.flip?-16:16,x0=-L/2+52,x1=L/2-88,pw=Math.max(60,x1-x0);c.beginPath();rrect(c,x0,y-15,pw,30,15);c.fillStyle='rgba(60,70,85,.14)';c.fill();
      c.save();c.translate(x0+pw/2,y);c.rotate(-i.rot);c.fillStyle='#2b3440';c.font='700 16px Segoe UI,Arial,sans-serif';c.fillText(fmtAng(i.rot),0,1);c.restore()}
  }else if(i.kind==='protractor'){
    const R=i.R,fl=i.flip,A=d=>fl?Math.PI-d*Math.PI/180:d*Math.PI/180,A2=d=>fl?d*Math.PI/180:Math.PI-d*Math.PI/180;
    const pt=(a,r)=>[r*Math.cos(a),-r*Math.sin(a)];
    c.beginPath();c.arc(0,0,R,Math.PI,2*Math.PI);c.closePath();c.fillStyle='rgba(120,104,226,.42)';c.fill();
    c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=2;c.stroke();
    c.beginPath();c.arc(0,0,R,Math.PI,2*Math.PI);c.arc(0,0,R-36,2*Math.PI,Math.PI,true);c.closePath();c.fillStyle='rgba(255,255,255,.17)';c.fill();
    c.beginPath();c.arc(0,0,R-36,Math.PI,2*Math.PI);c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;c.stroke();
    c.strokeStyle='rgba(15,10,60,.55)';c.beginPath();
    for(let d=0;d<=180;d+=10){c.moveTo(0,0);c.lineTo(...pt(A(d),R-36))}c.stroke();
    c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();
    for(let d=0;d<=180;d++){
      const L=d%10===0?16:d%5===0?11:6,L2=d%10===0?12:d%5===0?8:4;
      c.moveTo(...pt(A(d),R));c.lineTo(...pt(A(d),R-L));
      c.moveTo(...pt(A2(d),R-36));c.lineTo(...pt(A2(d),R-36-L2));
    }
    c.stroke();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
    for(let d=0;d<=180;d+=10){
      let a=A(d),p=pt(a,R-27);c.save();c.translate(p[0],p[1]);c.rotate(Math.PI/2-a);c.font='700 12px Segoe UI,Arial,sans-serif';c.fillText(String(d),0,0);c.restore();
      a=A2(d);p=pt(a,R-57);c.save();c.translate(p[0],p[1]);c.rotate(Math.PI/2-a);c.font='11px Segoe UI,Arial,sans-serif';c.globalAlpha=.8;c.fillText(String(d),0,0);c.restore();
    }
    c.globalAlpha=1;c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(-R,0);c.lineTo(R,0);c.stroke();
    c.lineWidth=1.5;c.beginPath();c.moveTo(-10,0);c.lineTo(10,0);c.moveTo(0,-10);c.lineTo(0,10);c.stroke();
  }else{
    const v=sqVerts(i),q=.56;
    c.beginPath();v.forEach((p,k)=>k?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();
    v.forEach((p,k)=>k?c.lineTo(p.x*q,p.y*q):c.moveTo(p.x*q,p.y*q));c.closePath();
    c.fillStyle='rgba(104,170,255,.34)';c.fill('evenodd');c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=2;c.stroke();
    const ang=i.kind==='sq45'?[90,45,45]:[90,30,60];
    const lp=v.map((p,k)=>{const L=Math.hypot(p.x,p.y),f=1-(k===0?34:44)/L;return{x:p.x*f,y:p.y*f}});
    c.strokeStyle='#e9f3ff';c.fillStyle='#e9f3ff';c.lineWidth=1;c.font='10px Segoe UI,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';
    [[v[0],v[1]],[v[0],v[2]]].forEach(([a,b])=>{
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;let nx=-uy,ny=ux;if(nx*(-a.x)+ny*(-a.y)<0){nx=-nx;ny=-ny}
      const n=Math.floor(len/PXCM*2);c.beginPath();
      for(let k=0;k<=n;k++){const px=a.x+ux*k*PXCM/2,py=a.y+uy*k*PXCM/2,L=k%2===0?13:7;c.moveTo(px,py);c.lineTo(px+nx*L,py+ny*L)}
      c.stroke();
      for(let k=2;k<=n;k+=2){const tx=a.x+ux*k*PXCM/2+nx*23,ty=a.y+uy*k*PXCM/2+ny*23;if(lp.some(q=>Math.hypot(q.x-tx,q.y-ty)<30))continue;c.fillText(String(k/2),tx,ty)}
    });
    c.font='700 12px Segoe UI,Arial,sans-serif';c.lineWidth=3;c.strokeStyle='rgba(0,0,40,.55)';
    lp.forEach((q,k)=>{c.strokeText(ang[k]+'°',q.x,q.y);c.fillText(ang[k]+'°',q.x,q.y)});
  }
  c.restore();
}
function drawBtn(c,b,rot,on){
  c.save();c.translate(b.x,b.y);c.rotate(-rot);
  c.beginPath();rrect(c,-b.w/2,-b.h/2,b.w,b.h,b.h/2);c.fillStyle=on?'#ffd54f':'rgba(255,255,255,.97)';c.fill();
  c.strokeStyle='#14161a';c.fillStyle='#14161a';c.lineWidth=2;c.stroke();
  c.lineWidth=2.3;c.lineCap='round';c.lineJoin='round';c.beginPath();
  switch(b.id){
    case 'close':c.moveTo(-5,-5);c.lineTo(5,5);c.moveTo(5,-5);c.lineTo(-5,5);c.stroke();break;
    case 'flip':c.moveTo(-8,0);c.lineTo(8,0);c.moveTo(-8,0);c.lineTo(-3,-5);c.moveTo(-8,0);c.lineTo(-3,5);c.moveTo(8,0);c.lineTo(3,-5);c.moveTo(8,0);c.lineTo(3,5);c.stroke();break;
    case 'ok':c.moveTo(-7,0);c.lineTo(-2,6);c.lineTo(8,-6);c.stroke();break;
    case 'move':c.moveTo(-9,0);c.lineTo(9,0);c.moveTo(0,-9);c.lineTo(0,9);
      c.moveTo(-9,0);c.lineTo(-5,-3);c.moveTo(-9,0);c.lineTo(-5,3);c.moveTo(9,0);c.lineTo(5,-3);c.moveTo(9,0);c.lineTo(5,3);
      c.moveTo(0,-9);c.lineTo(-3,-5);c.moveTo(0,-9);c.lineTo(3,-5);c.moveTo(0,9);c.lineTo(-3,5);c.moveTo(0,9);c.lineTo(3,5);c.stroke();break;
    case 'rot':
      if(b.label==='ang'){c.font='700 13px Segoe UI,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(fmtAng(rot),0,1)}
      else{const t=1.6*Math.PI;c.arc(0,0,7,.2*Math.PI,t);c.stroke();
        const ex=7*Math.cos(t),ey=7*Math.sin(t),tx=-Math.sin(t),ty=Math.cos(t),nx=-ty,ny=tx;
        c.beginPath();c.moveTo(ex+tx*5,ey+ty*5);c.lineTo(ex+nx*4,ey+ny*4);c.lineTo(ex-nx*4,ey-ny*4);c.closePath();c.fill()}
      break;
    case 'd180':c.font='700 10px Segoe UI,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('180°',0,1);break;
    case 'pen':c.moveTo(-6,6);c.lineTo(-5,2);c.lineTo(3,-6);c.lineTo(6,-3);c.lineTo(-2,5);c.closePath();c.stroke();break;
  }
  c.restore();
}

/* ---------- compass ---------- */
function cmp(i){
  const dx=i.rad*Math.cos(i.ang),dy=i.rad*Math.sin(i.ang);
  const N={x:i.nx,y:i.ny},Q={x:i.nx+dx,y:i.ny+dy},M={x:N.x+dx/2,y:N.y+dy/2};
  const d=i.rad/2,h=Math.sqrt(Math.max(i.Lg*i.Lg-d*d,400));
  let ux=-dy/i.rad,uy=dx/i.rad;if(uy>0||(Math.abs(uy)<1e-6&&ux<0)){ux=-ux;uy=-uy}
  return{N,Q,M,H:{x:M.x+ux*h,y:M.y+uy*h},u:{x:ux,y:uy}};
}
function cmpBtns(i,g){
  const v0={x:g.Q.x-g.H.x,y:g.Q.y-g.H.y},l=Math.hypot(v0.x,v0.y),v={x:v0.x/l,y:v0.y/l};
  let p={x:-v.y,y:v.x};if(p.x*(g.Q.x-g.N.x)+p.y*(g.Q.y-g.N.y)<0)p={x:-p.x,y:-p.y};
  const P1=lerpP(g.H,g.Q,.3),b=(id,x,y,extra={})=>Object.assign({id,x,y,w:28,h:28},extra);
  return[
    b('close',g.H.x+g.u.x*54,g.H.y+g.u.y*54),
    b('move',g.H.x,g.H.y),
    b('d180',P1.x+p.x*40,P1.y+p.y*40),
    b('pen',P1.x+p.x*40+v.x*36,P1.y+p.y*40+v.y*36,{on:i.draw})
  ];
}
function legPoly(c,A,B,w0,w1){
  const dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  c.beginPath();c.moveTo(A.x+nx*w0,A.y+ny*w0);c.lineTo(B.x+nx*w1,B.y+ny*w1);c.lineTo(B.x-nx*w1,B.y-ny*w1);c.lineTo(A.x-nx*w0,A.y-ny*w0);c.closePath();
}
function drawCompass(c,i){
  const g=cmp(i),{N,Q,M,H,u}=g;
  c.save();c.lineJoin='round';c.lineCap='round';
  c.setLineDash([6,5]);c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=1.5;c.beginPath();c.moveTo(N.x,N.y);c.lineTo(Q.x,Q.y);c.stroke();c.setLineDash([]);
  c.font='700 15px Segoe UI,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.6)';
  const lab=(i.rad/PXCM).toFixed(1)+' cm';c.strokeText(lab,M.x,M.y+22);c.fillStyle='#fff';c.fillText(lab,M.x,M.y+22);
  // needle leg
  const nb=lerpP(N,H,16/Math.max(20,Math.hypot(H.x-N.x,H.y-N.y)));
  legPoly(c,H,nb,9,5);let gr=c.createLinearGradient(H.x-10,0,H.x+10,0);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#d7dde3');
  c.fillStyle=gr;c.fill();c.strokeStyle='#8c97a3';c.lineWidth=1.5;c.stroke();
  legPoly(c,nb,N,4,.6);c.fillStyle='#3a3f45';c.fill();
  // pencil leg
  const lq=Math.hypot(Q.x-H.x,Q.y-H.y),v={x:(Q.x-H.x)/lq,y:(Q.y-H.y)/lq};
  const P1=lerpP(H,Q,.64);legPoly(c,H,P1,9,7);c.fillStyle='#fff';c.fill();c.strokeStyle='#8c97a3';c.lineWidth=1.5;c.stroke();
  const at=d=>({x:P1.x+v.x*d,y:P1.y+v.y*d});
  legPoly(c,P1,at(34),13,12);c.fillStyle='#2e3238';c.fill();
  const pEnd={x:Q.x-v.x*30,y:Q.y-v.y*30};
  legPoly(c,at(26),pEnd,6.5,6.5);c.fillStyle='#f6c635';c.fill();c.strokeStyle='#a4780d';c.lineWidth=1.2;c.stroke();
  legPoly(c,pEnd,Q,6.5,.5);c.fillStyle='#e8c48b';c.fill();
  legPoly(c,{x:Q.x-v.x*14,y:Q.y-v.y*14},Q,3,.4);c.fillStyle='#222';c.fill();
  // hinge + handle
  const top={x:H.x+u.x*34,y:H.y+u.y*34};
  legPoly(c,H,top,6,6);c.fillStyle='#d5dae0';c.fill();c.strokeStyle='#8c97a3';c.stroke();
  c.beginPath();c.arc(H.x,H.y,16,0,7);c.fillStyle='#2e3238';c.fill();
  cmpBtns(i,g).forEach(b=>drawBtn(c,b,0,b.on));
  c.restore();
}
function drawInsts(c){
  for(const i of insts){
    if(i.kind==='compass'){drawCompass(c,i);continue}
    c.save();c.translate(i.x,i.y);c.rotate(i.rot);
    drawBody(c,i,true);
    btnsOf(i).forEach(b=>drawBtn(c,b,i.rot,false));
    c.restore();
  }
}

/* ---------- picking + dragging ---------- */
const EDGEPX=14,SNAPSH=['line','dotted','dashed','arrow','darrow','curve'];
const canSnap=()=>(st.tool==='pen'&&st.brush!=='fill')||(st.tool==='shape'&&SNAPSH.includes(st.shape));
function instPick(sx,sy){
  for(let k=insts.length-1;k>=0;k--){
    const i=insts[k];
    if(i.kind==='compass'){
      const g=cmp(i),pt={x:sx,y:sy};
      for(const b of cmpBtns(i,g))if(Math.abs(sx-b.x)<=b.w/2+4&&Math.abs(sy-b.y)<=b.h/2+4)return{i,part:'btn',id:b.id};
      if(segDist(pt,lerpP(g.H,g.Q,.62),g.Q)<24)return{i,part:'cpen'};
      if(segDist(pt,g.H,g.N)<20||segDist(pt,g.H,g.Q)<16||Math.hypot(sx-g.H.x,sy-g.H.y)<24||segDist(pt,g.H,{x:g.H.x+g.u.x*34,y:g.H.y+g.u.y*34})<12)return{i,part:'cmove'};
      continue;
    }
    const l=toLocal(i,sx,sy);
    for(const b of btnsOf(i))if(Math.abs(l.x-b.x)<=b.w/2+4&&Math.abs(l.y-b.y)<=b.h/2+4)return{i,part:'btn',id:b.id};
    for(const[a,b2]of edgesOf(i))if(segDist(l,a,b2)<=EDGEPX)return{i,part:'edge',a:toScr(i,a.x,a.y),b:toScr(i,b2.x,b2.y)};
    if(bodyHit(i,l))return{i,part:'body'};
  }
  return null;
}
function snapW(e){
  const A=snapLine.a,B=snapLine.b,dx=B.x-A.x,dy=B.y-A.y,l=dx*dx+dy*dy;
  let t=l?((e.clientX-A.x)*dx+(e.clientY-A.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return s2w(A.x+t*dx+snapLine.n.x*snapLine.off,A.y+t*dy+snapLine.n.y*snapLine.off);
}
function instBtn(hit,e){
  const i=hit.i;
  switch(hit.id){
    case 'close':insts=insts.filter(x=>x!==i);refreshTiles();draw();return;
    case 'flip':i.flip=!i.flip;draw();return;
    case 'ok':stampInst(i);return;
    case 'rot':instDrag={mode:'rot',inst:i,a0:Math.atan2(e.clientY-i.y,e.clientX-i.x),r0:i.rot};return;
    case 'move':instDrag={mode:'cmove',inst:i,lx:e.clientX,ly:e.clientY};return;
    case 'd180':compass180(i);return;
    case 'pen':i.draw=!i.draw;toast(i.draw?'Compass is drawing — drag the pencil to draw an arc':'Compass is opening — drag the pencil to set the radius');draw();return;
  }
}
function instMove(e){
  const d=instDrag,i=d.inst,sx=e.clientX,sy=e.clientY;
  if(d.mode==='move'){i.x=sx-d.ox;i.y=sy-d.oy}
  else if(d.mode==='rot'){let dg=rad2deg(d.r0+(Math.atan2(sy-i.y,sx-i.x)-d.a0)),q=Math.round(dg/15)*15;if(Math.abs(dg-q)<1.5)dg=q;i.rot=dg*Math.PI/180}
  else if(d.mode==='cmove'){i.nx+=sx-d.lx;i.ny+=sy-d.ly;d.lx=sx;d.ly=sy}
  else if(d.mode==='cpen'){
    if(i.draw){
      const na=Math.atan2(sy-i.ny,sx-i.nx);let da=na-i.ang;da=Math.atan2(Math.sin(da),Math.cos(da));
      const n=Math.max(1,Math.ceil(Math.abs(da)/.04));
      for(let k=1;k<=n;k++){const a=i.ang+da*k/n;d.stroke.pts.push(s2w(i.nx+i.rad*Math.cos(a),i.ny+i.rad*Math.sin(a)))}
      i.ang+=da;
    }else{
      const dx=sx-i.nx,dy=sy-i.ny;i.rad=Math.max(.5*PXCM,Math.min(i.Lg*1.8,Math.hypot(dx,dy)));i.ang=Math.atan2(dy,dx);
    }
  }
  draw();
}
function finishInst(){
  const d=instDrag;instDrag=null;
  if(d.stroke&&d.stroke.pts.length>1){P().objs.push(d.stroke);inkAdd(d.stroke);snapshot()}
  draw();
}
function compass180(i){
  const pts=[],n=48;
  for(let k=0;k<=n;k++){const a=i.ang+Math.PI*k/n;pts.push(s2w(i.nx+i.rad*Math.cos(a),i.ny+i.rad*Math.sin(a)))}
  const o={t:'stroke',pts,color:st.color,size:Math.max(2,st.size),brush:'pen'};
  P().objs.push(o);inkAdd(o);snapshot();i.ang+=Math.PI;draw();
}
function stampInst(i){
  const w=s2w(i.x,i.y),o={t:'stamp',kind:i.kind,flip:i.flip,x:w.x,y:w.y,rot:i.rot,k:1/st.zoom,L:i.L,H:i.H,Lc:i.Lc,R:i.R,s:i.s};
  P().objs.push(o);inkAdd(o);snapshot();insts=insts.filter(x=>x!==i);refreshTiles();draw();toast('Placed on the board');
}
function addInst(kind){
  const ex=insts.find(i=>i.kind===kind);
  if(ex){insts=insts.filter(i=>i!==ex);refreshTiles();draw();return}
  const cx=innerWidth/2,cy=innerHeight/2-40;let i;
  if(kind==='ruler'){const Lc=Math.max(8,Math.min(30,Math.floor(innerWidth*.8/PXCM)));i={kind,x:cx,y:cy,rot:0,flip:false,L:Lc*PXCM,Lc,H:80}}
  else if(kind==='protractor'){const R=Math.min(300,innerWidth*.36,innerHeight*.52);i={kind,x:cx,y:cy+R/2,rot:0,flip:false,R}}
  else if(kind==='compass'){const Lg=Math.max(200,Math.min(360,innerHeight*.45)),rad=4*PXCM;i={kind,Lg,nx:cx-rad/2,ny:Math.min(innerHeight-130,cy+Lg*.85),ang:0,rad,draw:false}}
  else{const s=Math.min(420,innerWidth*.45,innerHeight*.6);i={kind,x:cx,y:cy,rot:0,flip:false,s}}
  if(kind!=='compass'){const k=insts.filter(x=>x.kind!=='compass').length;i.x+=k*72;i.y+=k*56}
  insts.push(i);refreshTiles();draw();
}

/* ---------- text tool ---------- */
function startText(sx,sy){
  const w=s2w(sx,sy),fs=Math.max(16,st.size*4+14);
  const ta=document.createElement('textarea');ta.wrap='off';ta.rows=1;
  ta.style.cssText=`position:fixed;left:${sx}px;top:${sy}px;width:240px;height:${Math.round(fs*st.zoom*1.4)}px;font:${fs*st.zoom}px 'Segoe UI',Arial,sans-serif;line-height:1.25;color:${st.color};background:rgba(128,128,128,.12);border:1.5px dashed #2f9bff;outline:none;resize:both;z-index:16;padding:0 2px;margin:0;overflow:hidden`;
  document.body.appendChild(ta);setTimeout(()=>ta.focus(),30);
  let done=false;
  const commit=()=>{if(done)return;done=true;const t=ta.value.replace(/\s+$/,'');ta.remove();if(t){const o={t:'text',x:w.x,y:w.y,text:t,size:fs,color:st.color};P().objs.push(o);inkAdd(o);snapshot();draw()}};
  ta.addEventListener('blur',commit);
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight,fs*st.zoom*1.4)+'px'});
  ta.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Escape'){ta.value='';commit()}else if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();commit()}});

function mkCalc(){
  let cur='0',acc=null,op=null,fresh=true;
  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','=','√','x²'];
  const b=document.createElement('div');
  b.innerHTML='<div class="lcd"><small></small><span>0</span></div><div class="calc">'+keys.map(k=>`<button class="wbtn${'÷×−+'.includes(k)?' op':k==='='?' go':''}${k==='√'||k==='x²'?' span2':''}" data-k="${k}">${k}</button>`).join('')+'</div>';
  const L=b.querySelector('.lcd span'),S=b.querySelector('.lcd small');
  const fmt=n=>isFinite(n)?String(parseFloat(n.toPrecision(12))):'Error';
  const calc=(a,c,o)=>o==='+'?a+c:o==='−'?a-c:o==='×'?a*c:c===0?NaN:a/c;
  const show=()=>{L.textContent=cur;S.textContent=acc!==null&&op?fmt(acc)+' '+op:''};
  b.onclick=e=>{
    const k=e.target.dataset.k;if(!k)return;
    if(/^[0-9]$/.test(k)){if(fresh||cur==='0'||cur==='Error'){cur=k;fresh=false}else if(cur.length<14)cur+=k}
    else if(k==='.'){if(fresh||cur==='Error'){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if('+−×÷'.includes(k)){if(op&&!fresh)cur=fmt(calc(acc,parseFloat(cur),op));acc=parseFloat(cur);op=k;fresh=true}
    else if(k==='='){if(op){cur=fmt(calc(acc,parseFloat(cur),op));acc=null;op=null;fresh=true}}
    else if(k==='C'){cur='0';acc=null;op=null;fresh=true}
    else if(k==='⌫'){if(!fresh){cur=cur.length>1?cur.slice(0,-1):'0';if(cur==='-')cur='0'}}
    else if(k==='±'){if(cur!=='0'&&cur!=='Error')cur=cur[0]==='-'?cur.slice(1):'-'+cur}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100);fresh=true}
    else if(k==='√'){cur=fmt(Math.sqrt(parseFloat(cur)));fresh=true}
    else if(k==='x²'){cur=fmt(Math.pow(parseFloat(cur),2));fresh=true}
    show();
  };
  makeWidget('calc','Calculator',b);
}

const laserCv=$('laserCv'),lctx=laserCv.getContext('2d');let laserPts=[],laserPos=null,laserRaf=0;
function laserMode(on){
  laserCv.style.display=on?'block':'none';
  if(on){const d=devicePixelRatio||1;laserCv.width=Math.round(innerWidth*d);laserCv.height=Math.round(innerHeight*d);if(!laserRaf)laserRaf=requestAnimationFrame(laserFrame)}

function laserPush(e){laserPos={x:e.clientX,y:e.clientY};laserPts.push({x:e.clientX,y:e.clientY,t:performance.now()})}
function laserFrame(){
  laserRaf=0;if(st.tool!=='laser')return;
  const d=devicePixelRatio||1,now=performance.now(),LIFE=900;
  lctx.setTransform(d,0,0,d,0,0);lctx.clearRect(0,0,innerWidth,innerHeight);
  laserPts=laserPts.filter(q=>now-q.t<LIFE);
  lctx.lineCap='round';lctx.lineJoin='round';
  for(let k=1;k<laserPts.length;k++){
    const a=laserPts[k-1],b=laserPts[k],al=1-(now-b.t)/LIFE;
    if(Math.hypot(b.x-a.x,b.y-a.y)>160)continue;
    lctx.strokeStyle=`rgba(255,40,40,${al*.3})`;lctx.lineWidth=16*al+4;lctx.beginPath();lctx.moveTo(a.x,a.y);lctx.lineTo(b.x,b.y);lctx.stroke();
    lctx.strokeStyle=`rgba(255,110,110,${al})`;lctx.lineWidth=5*al+1.5;lctx.beginPath();lctx.moveTo(a.x,a.y);lctx.lineTo(b.x,b.y);lctx.stroke();
  }
  if(laserPos){
    const g=lctx.createRadialGradient(laserPos.x,laserPos.y,0,laserPos.x,laserPos.y,26);
    g.addColorStop(0,'rgba(255,60,60,.9)');g.addColorStop(.35,'rgba(255,40,40,.45)');g.addColorStop(1,'rgba(255,40,40,0)');
    lctx.fillStyle=g;lctx.beginPath();lctx.arc(laserPos.x,laserPos.y,26,0,7);lctx.fill();
    lctx.fillStyle='#fff';lctx.beginPath();lctx.arc(laserPos.x,laserPos.y,3.2,0,7);lctx.fill();
  }
  laserRaf=requestAnimationFrame(laserFrame);
}

const TL=[
  ['sec','Geometry instruments'],
  ['ruler','Ruler'],['protractor','Protractor'],['compass','Compass'],['sq45','Set square 45°'],['sq30','Set square 30°–60°'],
  ['sec','Classroom tools'],
  ['text','Text'],['image','Insert image'],['laser','Laser pointer'],['mag','Magnifier'],['spot','Spotlight'],['shade','Screen shade'],['clock','Clock'],['timer','Timer'],['stopwatch','Stopwatch'],['dice','Dice'],['calc','Calculator']
];
TL.forEach(t=>{
  if(t[0]==='sec'){const d=document.createElement('div');d.className='secTitle';d.textContent=t[1];$('toolGrid').appendChild(d);return}
  const d=document.createElement('div');d.className='tile';d.dataset.t=t[0];
  d.innerHTML=`<svg viewBox="0 0 40 40">${TI[t[0]]}</svg><span>${t[1]}</span>`;
  d.onclick=()=>runTool(t[0]);$('toolGrid').appendChild(d);
});
function runTool(id){
  closePops();
  if(['ruler','protractor','compass','sq45','sq30'].includes(id)){addInst(id);return}
  if(id==='text'){setTool('text');toast('Tap on the board and type · press Ctrl+Enter or tap elsewhere to place · pen size sets the text size');return}
  if(id==='image'){$('imgIn').click();return}
  if(id==='laser'){if(st.tool==='laser')setTool('pen');else{setTool('laser');toast('Laser pointer — move or drag over the board. Pick any tool to stop.')}return}
  if(id==='mag'){toggleMag();return}
  if(id==='spot'){toggleSpot();return}
  if(id==='shade'){toggleShade();return}
  toggleWidget(id);
}
function refreshTiles(){
  document.querySelectorAll('.tile').forEach(t=>{
    const id=t.dataset.t;let on=false;
    if(insts.some(i=>i.kind===id)||widgets[id])on=true;
    else if(id==='laser')on=st.tool==='laser';else if(id==='mag')on=!!mag;else if(id==='spot')on=!!spot;else if(id==='shade')on=!!shade;else if(id==='text')on=st.tool==='text';
    t.classList.toggle('on',on);
  });
}

/* ---------- phone pen bridge (local Bluetooth receiver) ---------- */
const phoneBridgeBadge=document.createElement('div');
phoneBridgeBadge.id='phoneBridgeBadge';
phoneBridgeBadge.textContent='Phone pen: connecting…';
phoneBridgeBadge.style.cssText='position:fixed;right:10px;top:10px;z-index:30;padding:7px 10px;border:1px solid #454545;border-radius:10px;background:#111;color:#bbb;font:12px Segoe UI,Arial,sans-serif;box-shadow:0 2px 8px #0008;pointer-events:none';
document.body.appendChild(phoneBridgeBadge);
let phoneSocket=null,phoneStroke=null,phoneReconnectTimer=null;
function phoneBridgeStatus(text,color='#bbb'){phoneBridgeBadge.textContent=text;phoneBridgeBadge.style.color=color}
function connectPhoneBridge(){
  if(phoneSocket&&(phoneSocket.readyState===WebSocket.OPEN||phoneSocket.readyState===WebSocket.CONNECTING))return;
  try{
    phoneSocket=new WebSocket('ws://127.0.0.1:8765/');
    phoneSocket.onopen=()=>phoneBridgeStatus('Phone pen: ready','#7ee787');
    phoneSocket.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch(_){return}
      if(typeof m.x!=='number'||typeof m.y!=='number')return;
      const p=world({clientX:m.x*innerWidth,clientY:m.y*innerHeight});
      if(m.type==='start'){
        if(drawing||instDrag||panStart)return;
        phoneStroke={t:'stroke',pts:[p],color:'#ffffff',size:3.2/Math.max(.25,st.zoom),brush:'pen'};
        drawing=phoneStroke;draw();return;
      }
      if(!phoneStroke||drawing!==phoneStroke)return;
      const last=phoneStroke.pts[phoneStroke.pts.length-1];
      if(Math.hypot(p.x-last.x,p.y-last.y)>.35)phoneStroke.pts.push(p);
      if(m.type==='end'){
        const o=phoneStroke;phoneStroke=null;drawing=null;
        if(o.pts.length===1)o.pts.push({x:o.pts[0].x+.01,y:o.pts[0].y+.01});
        P().objs.push(o);inkAdd(o);snapshot();draw();return;
      }
      draw();
    };
    phoneSocket.onerror=()=>phoneBridgeStatus('Phone pen: start receiver','#ffcc66');
    phoneSocket.onclose=()=>{phoneBridgeStatus('Phone pen: receiver offline','#999');phoneSocket=null;clearTimeout(phoneReconnectTimer);phoneReconnectTimer=setTimeout(connectPhoneBridge,2500)};
  }catch(_){phoneBridgeStatus('Phone pen: receiver offline','#999')}
}
connectPhoneBridge();

/* ---------- start ---------- */
pickBrush(st.brush);setColor(st.color);
resize();updUI();setTool('pen');
})();
